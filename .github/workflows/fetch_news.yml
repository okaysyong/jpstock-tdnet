# ── 공시 유형 분류 ────────────────────────────────
def _disc_type(title: str) -> str:
    if any(k in title for k in ["決算短信","四半期"]):         return "決算短信"
    if any(k in title for k in ["上方修正","業績修正","下方修正",
                                  "業績予想","売上高修正"]):    return "業績修正"
    if "上方修正" in title:                                    return "業績修正▲"
    if "下方修正" in title:                                    return "業績修正▽"
    if any(k in title for k in ["TOB","公開買付"]):            return "TOB"
    if any(k in title for k in ["自己株式","自社株"]):         return "自社株取得"
    if any(k in title for k in ["合併","経営統合","株式交換"]): return "M&A"
    if any(k in title for k in ["業務提携","資本提携"]):       return "業務提携"
    if "株式分割" in title:                                    return "株式分割"
    if any(k in title for k in ["配当","増配","減配"]):        return "配当"
    if any(k in title for k in ["代表取締役","社長","役員"]):  return "役員変更"
    if any(k in title for k in ["増資","公募","第三者割当"]):  return "増資"
    if any(k in title for k in ["上場廃止","民事再生","破産"]): return "上場廃止"
    if any(k in title for k in ["新規上場","IPO"]):            return "新規上場"
    if any(k in title for k in ["受注","契約締結"]):           return "受注"
    if "株主優待" in title:                                    return "株主優待"
    if "大量保有" in title:                                    return "大量保有"
    return "その他"

def _classify_disc(title: str) -> int:
    if any(kw in title for kw in EXCLUDE_DISC_KW):
        return 0
    if any(kw in title for kw in RANK3_KW):
        return 3
    if any(kw in title for kw in RANK2_KW):
        return 2
    return 1

def fetch_tdnet() -> int:
    """TDnet 공시 수집 → DB 저장. 신규 건수 반환."""
    start = time.time()
    new_count = 0
    news_mirrored = 0

    try:
        res = requests.get(
            YANOSHIN_URL,
            headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"},
            timeout=12
        )
        data = res.json()
        items = data if isinstance(data, list) else data.get("items", [])

        now_jst = datetime.now(JST)
        with get_db() as conn:
            for item in items:
                disc_id    = str(item.get("id", "") or item.get("document_id", ""))
                stock_code = str(item.get("securities_code", "") or "").strip()
                company    = (item.get("company_name", "") or "").strip()
                title      = (item.get("title", "") or item.get("document_title", "")).strip()
                pdf_url    = (item.get("document_url", "") or "").strip()
                disc_time  = (item.get("time", "") or item.get("document_date_time", "")).strip()

                if not disc_id or not title:
                    continue

                rank = _classify_disc(title)
                if rank == 0:
                    continue

                disc_type = _disc_type(title)

                # 시간 파싱
                try:
                    if "T" in disc_time:
                        dt = datetime.fromisoformat(disc_time).astimezone(JST)
                    else:
                        dt = now_jst
                    disc_at = dt.strftime("%Y-%m-%d %H:%M:%S")
                    disc_date = dt.strftime("%Y-%m-%d")
                    disc_hm   = dt.strftime("%H:%M")
                except Exception:
                    disc_at   = now_jst.strftime("%Y-%m-%d %H:%M:%S")
                    disc_date = now_jst.strftime("%Y-%m-%d")
                    disc_hm   = now_jst.strftime("%H:%M")

                try:
                    conn.execute("""
                        INSERT OR IGNORE INTO company_disclosures
                        (disclosure_id, stock_code, company_name, title,
                         disclosed_at, rank, pdf_url)
                        VALUES (?,?,?,?,?,?,?)
                    """, (disc_id, stock_code, company, title, disc_at, rank, pdf_url))
                    if conn.execute("SELECT changes()").fetchone()[0]:
                        new_count += 1

                        # rank2 이상 공시 → stock_news에도 미러링
                        if rank >= 2:
                            import hashlib as _hl
                            sn_title = f"【{disc_type}】{company} {title}"
                            sn_id    = _hl.md5(f"tdnet_{disc_id}".encode()).hexdigest()[:12]
                            imp      = 3 if rank >= 3 else 2
                            conn.execute("""
                                INSERT OR IGNORE INTO stock_news
                                    (id, code, company, title, url, time, date,
                                     source, category, importance, fetched_at)
                                VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                            """, (
                                sn_id, stock_code, company,
                                sn_title, pdf_url,
                                disc_hm, disc_date,
                                "tdnet", disc_type, imp,
                                now_jst.strftime("%Y-%m-%d %H:%M"),
                            ))
                            if conn.execute("SELECT changes()").fetchone()[0]:
                                news_mirrored += 1

                except Exception as e:
                    log.warning(f"공시 DB 저장 오류: {e}")
            conn.commit()

    except Exception as e:
        log.warning(f"TDnet 수집 오류: {e}")

    elapsed = time.time() - start
    log.info(f"  [TDnet] 신규 {new_count}건 (stock_news 미러 {news_mirrored}건) ({elapsed:.1f}초)")
    return new_count

