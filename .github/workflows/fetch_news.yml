def cleanup_old_data():
    news_cutoff  = (datetime.now(JST) - timedelta(days=NEWS_RETAIN_DAYS)).strftime("%Y-%m-%d")
    tdnet_cutoff = (datetime.now(JST) - timedelta(days=TDNET_RETAIN_DAYS)).strftime("%Y-%m-%d")
    logs_cutoff  = (datetime.now(JST) - timedelta(days=2)).strftime("%Y-%m-%d")

    with get_db() as conn:
        n1 = conn.execute("DELETE FROM news_feed WHERE published_at < ?", (news_cutoff,)).rowcount
        n2 = conn.execute("DELETE FROM company_disclosures WHERE disclosed_at < ?", (tdnet_cutoff,)).rowcount
        n3 = conn.execute("DELETE FROM scheduler_logs WHERE started_at < ?", (logs_cutoff,)).rowcount
        conn.commit()
    log.info(f"  [청소] 뉴스 {n1}건, 공시 {n2}건, 로그 {n3}건 삭제")

