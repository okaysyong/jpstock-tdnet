_last_cleanup = 0.0

def run_gpt_ranking():
    """GPT-3.5로 뉴스 중요도 랭킹 처리 (10분마다)"""
    global _last_gpt_rank_ts, _gpt_rank_cache

    if not OPENAI_API_KEY:
        return
    if time.time() - _last_gpt_rank_ts < GPT_RANK_INTERVAL:
        return

    _last_gpt_rank_ts = time.time()

    try:
        # 최신 뉴스 20건 가져오기
        with get_db() as conn:
            rows = conn.execute("""
                SELECT uid, title, source, published_at, stocks, sectors, score
                FROM news_feed
                WHERE published_at >= datetime('now', '-24 hours', 'localtime')
                ORDER BY score DESC, published_at DESC
                LIMIT 20
            """).fetchall()

        if not rows:
            return

        fresh = [dict(r) for r in rows]
        titles = [f"{i+1}. {n['title']}" for i, n in enumerate(fresh)]
        news_block = "\n".join(titles)

        # GPT 호출
        import openai as _oai
        client_gpt = _oai.OpenAI(api_key=OPENAI_API_KEY)
        prompt = (
            f"以下のニュースから【日本株価に直接影響するもの】を厳選し、各ニュースの市場への影響を分析してください。\n\n"
            f"ニュース:\n{news_block}\n\n"
            f"分類基準:\n"
            f"world: FRB金利/米雇用統計/GDP/関税/半導体規制/原油/地政学リスク(株価直撃のみ、最大3件)\n"
            f"japan: 日銀政策/円相場急変/企業決算/業績修正/TOB/M&A/日本経済指標/適時開示(最大5件)\n"
            f"❌除外: 政治家発言/外交/スポーツ/芸能/社会事件/株価と無関係な内容\n\n"
            f"各ニュースに対してimpact(影響先と方向性、20字以内)を付けてください。\n"
            f"impactは【具体的な銘柄・セクター・指数】と【↑/↓方向】を25字以内で。\n"
            f"例: '東京エレク↑・半導体全般に買い', 'ドル円↓・輸出株に売り', '銀行株↑・金利上昇期待'\n"
            f'返答JSON形式: {{"world":[{{"n":1,"impact":"具体的な影響"}}],"japan":[{{"n":2,"impact":"具体的な影響"}}]}}'
        )
        res = client_gpt.chat.completions.create(
            model="gpt-3.5-turbo",
            max_tokens=150,
            temperature=0.1,
            messages=[{"role": "user", "content": prompt}]
        )
        raw = res.choices[0].message.content.strip()
        import re as _re, json as _json
        raw = _re.sub(r'```json|```', '', raw, flags=_re.IGNORECASE).strip()
        parsed = _json.loads(raw)

        gpt_world, gpt_japan, ranked_uids = [], [], []

        def _parse_item(item):
            """{"n":1,"impact":"..."} 또는 숫자 형식 모두 처리"""
            if isinstance(item, dict):
                return int(item.get('n', 0)), item.get('impact', '')
            return int(item), ''

        for item in parsed.get("world", []):
            num, impact = _parse_item(item)
            idx = num - 1
            if 0 <= idx < len(fresh):
                n = fresh[idx]
                try:
                    dt = datetime.strptime(n["published_at"], "%Y-%m-%d %H:%M:%S").replace(tzinfo=JST)
                    time_str = dt.strftime("%H:%M")
                except Exception:
                    time_str = "--:--"
                gpt_world.append({
                    "uid": n["uid"], "title": n["title"],
                    "time_str": time_str, "url": "",
                    "impact": impact or "→ 世界市場", "breaking": idx == 0
                })
                ranked_uids.append(n["uid"])

        for item in parsed.get("japan", []):
            num, impact = _parse_item(item)
            idx = num - 1
            if 0 <= idx < len(fresh):
                n = fresh[idx]
                try:
                    dt = datetime.strptime(n["published_at"], "%Y-%m-%d %H:%M:%S").replace(tzinfo=JST)
                    time_str = dt.strftime("%H:%M")
                except Exception:
                    time_str = "--:--"
                gpt_japan.append({
                    "uid": n["uid"], "title": n["title"],
                    "time_str": time_str, "url": "",
                    "impact": impact or "→ 日本株", "breaking": False
                })
                ranked_uids.append(n["uid"])

        _gpt_rank_cache = {
            "world": gpt_world,
            "japan": gpt_japan,
            "ranked_uids": ranked_uids,
            "updated_at": time.time(),
        }
        log.info(f"  [GPT 랭킹] world:{len(gpt_world)} japan:{len(gpt_japan)}")

    except Exception as e:
        log.warning(f"  [GPT 랭킹] 오류: {e}")



    global _last_cleanup
    log.info("🚀 수집 루프 시작")

    while True:
        started = time.time()
        now_jst = datetime.now(JST)

        try:
            # 뉴스 수집
            rss_cnt  = fetch_rss()
            # 공시 수집 — 24시간 (장 후/심야 공시도 수집)
            tdnet_cnt = fetch_tdnet()

            # GPT 뉴스 랭킹 (10분마다)
            run_gpt_ranking()

            # 스케줄러 로그
            with get_db() as conn:
                conn.execute("""
                    INSERT INTO scheduler_logs (job_name, status, count, started_at)
                    VALUES ('rss+tdnet', 'SUCCESS', ?, ?)
                """, (rss_cnt + tdnet_cnt, now_jst.strftime("%Y-%m-%d %H:%M:%S")))
                conn.commit()

        except Exception as e:
            log.error(f"수집 루프 오류: {e}")
            with get_db() as conn:
                conn.execute("""
                    INSERT INTO scheduler_logs (job_name, status, error_msg, started_at)
                    VALUES ('rss+tdnet', 'FAIL', ?, ?)
                """, (str(e), now_jst.strftime("%Y-%m-%d %H:%M:%S")))
                conn.commit()

        # 매일 새벽 3시 청소
        if now_jst.hour == 3 and time.time() - _last_cleanup > 3600:
            cleanup_old_data()
            _last_cleanup = time.time()

        # 다음 수집까지 대기
        elapsed = time.time() - started
        sleep_sec = max(FETCH_INTERVAL - elapsed, 30)
        time.sleep(sleep_sec)

