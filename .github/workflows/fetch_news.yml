# 경제지표명 일본어 변환 캐시
_ev_translate_cache: dict = {}

def _translate_event(text: str) -> str:
    """경제지표명 → 일본어 변환 (GPT, 캐시 우선)"""
    if not text:
        return text
    if text in _ev_translate_cache:
        return _ev_translate_cache[text]
    # 주요 지표 하드코딩 (API 절약)
    TRANS = {
        "CPI": "消費者物価指数(CPI)",
        "Core CPI": "コアCPI",
        "PPI": "生産者物価指数(PPI)",
        "GDP": "GDP成長率",
        "Unemployment Rate": "失業率",
        "Nonfarm Payrolls": "非農業部門雇用者数",
        "FOMC": "FOMC政策金利決定",
        "Fed Interest Rate Decision": "FRB政策金利決定",
        "BOJ Interest Rate Decision": "日銀政策金利決定",
        "BOJ Monetary Policy Statement": "日銀金融政策声明",
        "Industrial Production": "鉱工業生産",
        "Retail Sales": "小売売上高",
        "Trade Balance": "貿易収支",
        "Current Account": "経常収支",
        "Bank of Japan Interest Rate Decision": "日銀政策金利決定",
        "Tankan Large Manufacturers Index": "日銀短観(大企業製造業)",
        "Tokyo CPI": "東京都区部消費者物価指数",
        "Japan CPI": "全国消費者物価指数",
    }
    for en, jp in TRANS.items():
        if en.lower() in text.lower():
            _ev_translate_cache[text] = jp
            return jp
    _ev_translate_cache[text] = text
    return text

def _ev_id(date: str, title: str, country: str) -> str:
    import hashlib as _hl
    return _hl.md5(f"{date}_{title}_{country}".encode()).hexdigest()[:12]

def _sq_dates(months: int = 3) -> list:
    """SQ 날짜 자동 계산 (매월 2번째 금요일 전날 = 목요일)"""
    results = []
    now = datetime.now(JST)
    for m in range(months * 2):
        # 대상 월 계산
        target = datetime(now.year, now.month, 1, tzinfo=JST) + timedelta(days=32 * m)
        target = target.replace(day=1)
        # 해당 월 2번째 금요일 찾기
        fridays = []
        d = target
        while d.month == target.month:
            if d.weekday() == 4:  # 금요일
                fridays.append(d)
            d += timedelta(days=1)
        if len(fridays) >= 2:
            sq_fri = fridays[1]  # 2번째 금요일
            sq_day = sq_fri - timedelta(days=1)  # SQ는 전날 목요일
            # 메이저SQ: 3,6,9,12월
            is_major = sq_day.month in [3, 6, 9, 12]
            results.append({
                "date": sq_day.strftime("%Y-%m-%d"),
                "is_major": is_major,
            })
    return results

def fetch_events_finnhub() -> int:
    """Finnhub 경제지표 월간 수집 → events DB 저장"""
    start = time.time()
    new_count = 0
    updated_count = 0

    try:
        now_jst   = datetime.now(JST)
        from_date = now_jst.strftime("%Y-%m-%d")
        to_date   = (now_jst + timedelta(days=35)).strftime("%Y-%m-%d")

        res = requests.get(
            "https://finnhub.io/api/v1/calendar/economic",
            params={"from": from_date, "to": to_date, "token": FINNHUB_KEY},
            timeout=12
        )
        events = res.json().get("economicCalendar", [])

        # JP + US, high/medium/low(JP만) 필터
        filtered = []
        for e in events:
            country = e.get("country", "")
            impact  = e.get("impact", "").lower()
            if country == "JP":
                filtered.append(e)  # JP는 전부
            elif country == "US" and impact in ["high", "medium"]:
                filtered.append(e)  # US는 high/medium만

        with get_db() as conn:
            for e in filtered:
                title   = e.get("event", "").strip()
                country = e.get("country", "JP")
                impact  = e.get("impact", "low").lower()
                raw_time = e.get("time", "")

                # 날짜/시각 파싱
                try:
                    dt = datetime.strptime(raw_time, "%Y-%m-%d %H:%M:%S")
                    dt_jst    = dt + timedelta(hours=9)
                    event_date = dt_jst.strftime("%Y-%m-%d")
                    event_time = dt_jst.strftime("%H:%M")
                except Exception:
                    event_date = raw_time[:10] if raw_time else from_date
                    event_time = "00:00"

                # 중요도 별점
                stars = 5 if impact == "high" else (3 if impact == "medium" else 1)
                if country == "JP" and impact == "low":
                    stars = 2  # JP low는 2점

                title_jp = _translate_event(title)
                ev_id    = _ev_id(event_date, title, country)

                forecast = str(e["estimate"]) if e.get("estimate") is not None else None
                previous = str(e["prev"])     if e.get("prev")     is not None else None
                actual   = str(e["actual"])   if e.get("actual")   is not None else None
                is_released = 1 if actual is not None else 0

                # 기존 레코드 확인
                existing = conn.execute(
                    "SELECT id, actual FROM events WHERE id=?", (ev_id,)
                ).fetchone()

                if existing is None:
                    conn.execute("""
                        INSERT OR IGNORE INTO events
                            (id, event_date, event_time, country, category,
                             title, title_jp, stars, forecast, previous, actual,
                             source, updated_at, is_released)
                        VALUES (?,?,?,?,?,?,?,?,?,?,?,?,datetime('now','localtime'),?)
                    """, (ev_id, event_date, event_time, country, "economic",
                          title, title_jp, stars, forecast, previous, actual,
                          "finnhub", is_released))
                    new_count += 1
                elif actual and existing[1] != actual:
                    # actual 값이 새로 나왔거나 변경됨 → 업데이트
                    conn.execute("""
                        UPDATE events SET
                            actual=?, is_released=1,
                            updated_at=datetime('now','localtime')
                        WHERE id=?
                    """, (actual, ev_id))
                    updated_count += 1

            conn.commit()

    except Exception as e:
        log.warning(f"[이벤트/Finnhub] 수집 오류: {e}")

    elapsed = time.time() - start
    log.info(f"  [이벤트] Finnhub 신규 {new_count}건 / 업데이트 {updated_count}건 ({elapsed:.1f}초)")
    return new_count + updated_count


def fetch_events_sq() -> int:
    """SQ 날짜 계산 → events DB 저장"""
    new_count = 0
    try:
        sq_list = _sq_dates(months=3)
        with get_db() as conn:
            for sq in sq_list:
                date     = sq["date"]
                is_major = sq["is_major"]
                title    = "メジャーSQ算出日" if is_major else "ミニSQ算出日"
                title_jp = title
                stars    = 5 if is_major else 3
                ev_id    = _ev_id(date, title, "JP")

                existing = conn.execute("SELECT id FROM events WHERE id=?", (ev_id,)).fetchone()
                if existing is None:
                    conn.execute("""
                        INSERT OR IGNORE INTO events
                            (id, event_date, event_time, country, category,
                             title, title_jp, stars, source, updated_at, is_released)
                        VALUES (?,?,?,?,?,?,?,?,?,datetime('now','localtime'),?)
                    """, (ev_id, date, "15:10", "JP", "sq",
                          title, title_jp, stars, "calculated", 0))
                    new_count += 1
            conn.commit()
    except Exception as e:
        log.warning(f"[이벤트/SQ] 오류: {e}")

    if new_count:
        log.info(f"  [이벤트] SQ {new_count}건 추가")
    return new_count


