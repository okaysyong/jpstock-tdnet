name: JP Stock News Fetcher

on:
  schedule:
    - cron: '*/5 0-7 * * 1-5'   # 평일 09:00~16:00 JST (5분마다)
    - cron: '0 */3 * * 0,6'     # 주말 3시간마다
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser pytz

      - name: Fetch and push news
        env:
          VPS_URL: ${{ secrets.VPS_URL }}
          VPS_TOKEN: ${{ secrets.VPS_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import requests, feedparser, json, time, hashlib, os
          from datetime import datetime, timezone, timedelta

          JST = timezone(timedelta(hours=9))
          VPS_URL = os.environ.get("VPS_URL", "https://jpstocklive.com")
          VPS_TOKEN = os.environ.get("VPS_TOKEN", "")

          RSS_FEEDS = [
              # NHK 경제/기업 특화
              ("nhk_eco",    "https://www.nhk.or.jp/rss/news/cat5.xml"),   # 경제/기업 ★
              ("nhk_world",  "https://www.nhk.or.jp/rss/news/cat4.xml"),   # 국제경제
              ("nhk_sci",    "https://www.nhk.or.jp/rss/news/cat6.xml"),   # 과학/기술
              # CNBC (미국장/글로벌 거시 — 주식 직접 영향)
              ("cnbc_asia",  "https://www.cnbc.com/id/20910258/device/rss/rss.html"),   # Asia Pacific
              ("cnbc_world", "https://www.cnbc.com/id/100003114/device/rss/rss.html"),  # World
              ("cnbc_fin",   "https://www.cnbc.com/id/10000664/device/rss/rss.html"),   # Finance
              # Yahoo Finance JP (필터링 강화)
              ("yahoo_biz",  "https://news.yahoo.co.jp/rss/categories/business.xml"),
          ]

          # 제외 키워드
          EXCLUDE_KW = [
              # 스포츠
              "サッカー","野球","バスケ","テニス","ゴルフ","ラグビー","五輪",
              "オリンピック","W杯","ワールドカップ","高校野球","Jリーグ","プロ野球",
              "大リーグ","MLB","NFL","NBA","ドジャース","ヤンキース",
              "大谷","佐々木朗","鈴木誠","松井裕","ホームラン","打点","登板",
              "大相撲","力士","横綱","金メダル","銀メダル","マラソン","駅伝",
              # 연예/문화
              "芸能","アイドル","歌手","俳優","映画","ドラマ","コンサート",
              "音楽","エンタメ","バラエティ","漫画","アニメ","タレント",
              # 날씨/재해
              "台風","大雨","洪水","土砂","ひょう","雷","竜巻","熱中症","梅雨",
              # 사건사고
              "交通事故","火災","逮捕","容疑者","殺人","詐欺被害","強盗",
              "行方不明","死亡事故","遺体","列車衝突","落下","衝突事故",
              # 황실/외교 무관
              "表敬訪問","記念式典","慰霊","追悼",
              "天皇","皇后","皇室","陛下","皇太子","皇族","両陛下",
              # 생활/취미
              "グルメ","食べ歩き","観光","旅行","温泉","スイーツ","ビリヤニ",
              "日焼け","スキンケア","美容","ダイエット",
              # 자동차 잡지
              "MotorFan","carview","ベストカーWeb","乗りものニュース",
              "Auto Messe","Aviation Wire","バイクのニュース",
              # 기타
              "定時制","通信制","フリマ","メルカリ","相続","口座凍結",
              "パチンコ","競馬","宝くじ","ハローワーク",
          ]

          # 고중요도 키워드 (일본어+영어)
          HIGH_KW = [
              # 일본어
              "日銀","BOJ","金利","FOMC","FRB","利上げ","利下げ",
              "GDP","CPI","PCE","雇用統計","インフレ","景気後退",
              "決算","業績修正","上方修正","下方修正","TOB","買収","合併",
              "上場廃止","破産","増資","自社株買い","配当修正",
              "日経平均","TOPIX","円高","円安","円相場","ドル円",
              "半導体","AI投資","関税","輸出規制","制裁",
              "原油","WTI","天然ガス","ホルムズ","台湾",
              # 영어 (CNBC용)
              "Bank of Japan","interest rate","Federal Reserve","Fed rate",
              "rate hike","rate cut","inflation","CPI","jobs report",
              "Nikkei","yen","USD/JPY","semiconductor","chip","tariff",
              "oil price","crude","OPEC","Taiwan","earnings","GDP",
              "SoftBank","Toyota","Sony","Nintendo","Tokyo Electron",
              "Japan stock","Japanese yen","sell-off","rally",
          ]

          # 중요도 키워드 (일본어+영어)
          MEDIUM_KW = [
              # 일본어
              "株式","株価","上場","IPO","投資","ファンド",
              "売上","利益","増収","増益","黒字","赤字",
              "受注","契約","提携","新製品","特許",
              "ソフトバンク","トヨタ","ソニー","任天堂","東京エレクトロン",
              "三菱UFJ","三井住友","みずほ","ファーストリテイリング",
              "輸出","輸入","需要","供給","市況",
              "イラン","ウクライナ","ロシア","EU","中国","米国",
              # 영어
              "Japan","Japanese market","Asia stocks","Asia Pacific",
              "trade","profit","revenue","forecast","outlook",
              "risk-off","risk-on","volatility","Fed","treasury","yield",
              "China","Korea","emerging market","dollar",
          ]

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/rss+xml, application/xml, text/xml, */*",
              "Accept-Language": "ja,en-US;q=0.9,en;q=0.8",
          }

          all_news = []
          seen_uids = set()

          for source, url in RSS_FEEDS:
              try:
                  r = requests.get(url, timeout=12, headers=headers)
                  if r.status_code != 200:
                      print(f"SKIP {source}: {r.status_code}")
                      continue
                  feed = feedparser.parse(r.text)
                  count = 0
                  for entry in feed.entries[:30]:
                      title = (entry.get("title") or "").strip()
                      if not title:
                          continue
                      # 제외 키워드
                      if any(kw in title for kw in EXCLUDE_KW):
                          continue
                      # CNBC는 HIGH/MEDIUM 키워드 있는 것만
                      if source.startswith("cnbc"):
                          if not any(kw in title for kw in HIGH_KW + MEDIUM_KW):
                              continue
                      # 중요도 계산
                      if any(kw in title for kw in HIGH_KW):
                          score = 4
                      elif any(kw in title for kw in MEDIUM_KW):
                          score = 3
                      else:
                          score = 2
                      uid = hashlib.md5(f"{source}:{title}".encode()).hexdigest()[:16]
                      if uid in seen_uids:
                          continue
                      seen_uids.add(uid)
                      try:
                          published = datetime(*entry.published_parsed[:6], tzinfo=timezone.utc).astimezone(JST).strftime("%Y-%m-%d %H:%M:%S")
                      except:
                          published = datetime.now(JST).strftime("%Y-%m-%d %H:%M:%S")
                      all_news.append({
                          "uid":          uid,
                          "title":        title,
                          "summary":      (entry.get("summary") or "")[:300],
                          "url":          entry.get("link") or "",
                          "source":       source,
                          "published_at": published,
                          "score":        score,
                      })
                      count += 1
                  print(f"OK {source}: {count}")
              except Exception as e:
                  print(f"ERR {source}: {e}")
              time.sleep(1)

          # score 높은 것 우선 정렬
          all_news.sort(key=lambda x: -x.get("score", 2))

          print(f"Total: {len(all_news)}")
          print(f"  HIGH(4): {len([x for x in all_news if x['score']==4])}")
          print(f"  MED (3): {len([x for x in all_news if x['score']==3])}")
          print(f"  LOW (2): {len([x for x in all_news if x['score']==2])}")

          if not all_news:
              print("No news")
              exit(0)

          try:
              res = requests.post(
                  f"{VPS_URL}/push/news",
                  json={"items": all_news, "token": VPS_TOKEN},
                  timeout=15,
              )
              print(f"VPS: {res.status_code} {res.text[:200]}")
          except Exception as e:
              print(f"VPS ERR: {e}")
          PYEOF
