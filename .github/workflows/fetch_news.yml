# 이벤트 수집 주기 관리
_last_event_fetch: float = 0.0
EVENT_FETCH_INTERVAL = 1800  # 30분마다

def fetch_events_nikkei225jp() -> int:
    """
    nikkei225jp.com/schedule/ #SihyoT 테이블 파싱 → events DB 저장
    컬럼: 날짜 | 시간 | ★별점 | 지표명 | 結果 | 予想 | 前回
    필터: JP ★2+, 기타국가 ★4+
    """
    import re as _re
    from bs4 import BeautifulSoup as _BS

    HEADERS = {
        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
        "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
        "Accept-Language": "ja,en-US;q=0.9,en;q=0.8",
        "Referer": "https://nikkei225jp.com/",
    }
    URL = "https://nikkei225jp.com/schedule/"

    # 국기 CSS 클래스 → 국가코드 (실제 클래스: flag1-jp, flag1-us 등)
    FLAG_MAP = {
        "flag1-jp": "JP", "flag1-us": "US", "flag1-eu": "EU",
        "flag1-de": "DE", "flag1-gb": "GB", "flag1-uk": "GB",
        "flag1-cn": "CN", "flag1-au": "AU", "flag1-kr": "KR",
        "flag1-fr": "FR", "flag1-ca": "CA", "flag1-in": "IN",
        "flag1-br": "BR", "flag1-ch": "CH", "flag1-nz": "NZ",
        "flag1-tr": "TR", "flag1-ru": "RU", "flag1-se": "SE",
        "flag1-no": "NO", "flag1-pl": "PL",
    }

    # 비경제 이벤트 필터
    NON_ECONOMIC_KW = [
        "FIFA", "ワールドカップ", "開幕", "閉幕", "上場予定",
        "休日", "休場", "G7サミット", "G20サミット", "サミット開始",
    ]

    def _is_nonecon(title):
        for kw in NON_ECONOMIC_KW:
            if kw in title:
                return True
        if "会見" in title:
            if any(cb in title for cb in ["日銀", "植田", "FRB", "Fed", "ECB", "ラガルド", "BOJ", "ウォーシュ"]):
                return False
            return True
        return False

    def _make_date(date_str):
        """MM/DD(曜) → YYYY-MM-DD"""
        m = _re.search(r"(\d{1,2})/(\d{2})", date_str)
        if not m:
            return None
        now_jst = datetime.now(JST)
        mo, d = int(m.group(1)), int(m.group(2))
        year = now_jst.year
        if mo < now_jst.month or (mo == now_jst.month and d < now_jst.day - 1):
            year += 1
        return f"{year}-{mo:02d}-{d:02d}"

    def _stars_count(text):
        """★★★ → 3"""
        return text.count("★")

    def _passes_filter(country, stars):
        """DB에는 ★1 이상 전체 저장 (표시 필터는 API/HTML에서 적용)"""
        return stars >= 1

    new_count = 0
    updated_count = 0

    try:
        res = requests.get(URL, headers=HEADERS, timeout=15)
        res.raise_for_status()
        soup = _BS(res.text, "html.parser")
    except Exception as e:
        log.warning(f"[nikkei225jp] 수집 실패: {e}")
        return 0

    tbl = soup.find("table", id="SihyoT")
    if not tbl:
        log.warning("[nikkei225jp] #SihyoT 테이블 없음")
        return 0

    now_jst   = datetime.now(JST)
    today_str = now_jst.strftime("%Y-%m-%d")
    current_date = None

    with get_db() as conn:
        for tr in tbl.find_all("tr"):
            # ── 날짜 헤더 행 ──
            date_td = tr.find("td", class_="date")
            if date_td:
                current_date = _make_date(date_td.get_text(strip=True))
                continue

            if not current_date:
                continue

            # 날짜 제한 없음 — 사이트에 있는 전체 기간 저장 (변경시 UPDATE)

            tds = tr.find_all("td")
            if len(tds) < 4:
                continue

            # ── 시간 ──
            time_td = tr.find("td", class_="time")
            time_str = time_td.get_text(strip=True) if time_td else "00:00"

            # ── 별점 ──
            pri_td = tr.find("td", class_="priority")
            stars = _stars_count(pri_td.get_text()) if pri_td else 0

            # ── 지표명 + 국가 (event td 내 flag1-xx 클래스 스팬) ──
            event_td = tr.find("td", class_="event")
            if not event_td:
                continue

            country = "JP"  # 기본값
            flag_span = event_td.find("span", class_=True)
            if flag_span:
                for cls in flag_span.get("class", []):
                    if cls in FLAG_MAP:
                        country = FLAG_MAP[cls]
                        break

            # 필터: JP ★2+, 기타 ★4+
            if not _passes_filter(country, stars):
                continue

            title = event_td.get_text(" ", strip=True).strip()
            if not title or len(title) < 2:
                continue
            if _is_nonecon(title):
                continue

            # ── 結果/予想/前回 ──
            result_td     = tr.find("td", class_="result")
            expect_td     = tr.find("td", class_="expectation")
            last_td       = tr.find("td", class_="last")

            actual   = result_td.get_text(strip=True)   if result_td   else None
            forecast = expect_td.get_text(strip=True)   if expect_td   else None
            previous = last_td.get_text(strip=True)     if last_td     else None

            # 빈 문자열 → None
            actual   = actual   if actual   else None
            forecast = forecast if forecast else None
            previous = previous if previous else None

            is_released = 1 if actual else 0

            ev_id = _ev_id(current_date, title, country)

            existing = conn.execute(
                "SELECT id, actual, forecast, previous FROM events WHERE id=?",
                (ev_id,)
            ).fetchone()

            if existing is None:
                # 신규 INSERT
                conn.execute("""
                    INSERT OR IGNORE INTO events
                        (id, event_date, event_time, country, category,
                         title, title_jp, stars, forecast, previous, actual,
                         source, updated_at, is_released)
                    VALUES (?,?,?,?,?,?,?,?,?,?,?,?,datetime('now','localtime'),?)
                """, (ev_id, current_date, time_str, country, "economic",
                      title, title, stars,
                      forecast, previous, actual,
                      "nikkei225jp", is_released))
                new_count += 1
            else:
                # UPSERT — actual/forecast/previous 변경 시만 UPDATE
                # actual 없는 것이 actual 있는 것을 덮어쓰지 않도록 COALESCE 사용
                changed = (
                    (actual   and existing[1] != actual)   or
                    (forecast and existing[2] != forecast) or
                    (previous and existing[3] != previous)
                )
                if changed:
                    conn.execute("""
                        UPDATE events SET
                            actual   = CASE WHEN ? IS NOT NULL THEN ? ELSE actual END,
                            forecast = CASE WHEN ? IS NOT NULL THEN ? ELSE forecast END,
                            previous = CASE WHEN ? IS NOT NULL THEN ? ELSE previous END,
                            is_released = CASE WHEN ? IS NOT NULL THEN 1 ELSE is_released END,
                            updated_at  = datetime('now','localtime')
                        WHERE id = ?
                    """, (actual, actual, forecast, forecast,
                          previous, previous, actual, ev_id))
                    updated_count += 1

        conn.commit()

    log.info(f"  [nikkei225jp] 신규 {new_count}건 / 업데이트 {updated_count}건")
    return new_count + updated_count


def fetch_events_all() -> int:
    """전체 이벤트 수집 (30분마다)"""
    global _last_event_fetch
    now = time.time()
    if now - _last_event_fetch < EVENT_FETCH_INTERVAL:
        return 0
    _last_event_fetch = now

    total = 0
    # ① nikkei225jp 스크래핑 (메인 소스 — 일본語 지표명, 결과/예상/전회 포함)
    total += fetch_events_nikkei225jp()
    # ② Finnhub (보완 소스 — US/EU 지표, forecast/actual 자동 업데이트)
    total += fetch_events_finnhub()
    # ③ SQ/BOJ 날짜 자동 계산
    total += fetch_events_sq()
    total += fetch_events_boj()
    return total


