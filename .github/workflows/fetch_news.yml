    return {"ok": True}

# ── 최신 상태 캐시 (재접속 시 즉시 전송용) ──────────────────
_LATEST_CACHE: dict = {}  # type → 최신 데이터 (메모리 캐시)

# 장 종료 후 초기화 대상 (다음날 08:00 JST 초기화)
_CACHE_DAILY_RESET = {"volume_ranking", "rise_fall_ranking", "sector_stocks", "sector_ranking"}
# 유지 대상 (장외에도 유효)
_CACHE_PERSIST = {"news", "news_tab", "schedule", "ticker", "indices"}

def _cache_save_db(data_type: str, payload: dict):
    """캐시 DB 저장"""
    try:
        with get_db() as conn:
            conn.execute("""
                INSERT INTO broadcast_cache (data_type, payload, saved_at)
                VALUES (?, ?, datetime('now','localtime'))
                ON CONFLICT(data_type) DO UPDATE SET
                    payload  = excluded.payload,
                    saved_at = excluded.saved_at
            """, (data_type, json.dumps(payload, ensure_ascii=False)))
            conn.commit()
    except Exception as e:
        log.warning(f"캐시 DB 저장 오류: {e}")

def _cache_load_db() -> list:
    """DB에서 캐시 전체 로드 — 다음날 08:00 JST 이후엔 일별 초기화 대상 제외"""
    try:
        now_jst = datetime.now(JST)
        cutoff_str = now_jst.strftime("%Y-%m-%d") + " 08:00:00"
        with get_db() as conn:
            rows = conn.execute(
                "SELECT data_type, payload, saved_at FROM broadcast_cache"
            ).fetchall()
        result = []
        for row in rows:
            data_type, payload_str, saved_at = row
            # 일별 초기화 대상: 오늘 08:00 이전에 저장된 것은 제외
            if data_type in _CACHE_DAILY_RESET:
                if saved_at < cutoff_str:
                    continue
            try:
                result.append(json.loads(payload_str))
            except Exception:
                pass
        return result
    except Exception as e:
        log.warning(f"캐시 DB 로드 오류: {e}")
        return []

@app.post("/push/cache")
def push_cache(payload: dict):
    """broadcast.py → 최신 데이터 캐시 저장 (메모리 + DB)"""
    data_type = payload.get("type", "")
    if data_type and payload:
        _LATEST_CACHE[data_type] = payload
        _cache_save_db(data_type, payload)
    return {"ok": True}

@app.get("/cache")
def get_cache():
    """재접속 시 최신 캐시 일괄 반환 (메모리 우선 → DB 폴백)"""
    if _LATEST_CACHE:
        return {"ok": True, "items": list(_LATEST_CACHE.values()), "src": "memory"}
    # 메모리 캐시 없으면 (재시작 후) DB에서 로드
    db_items = _cache_load_db()
    # 메모리 캐시에도 복원
    for item in db_items:
        dt = item.get("type", "")
        if dt:
            _LATEST_CACHE[dt] = item
    return {"ok": True, "items": db_items, "src": "db"}

