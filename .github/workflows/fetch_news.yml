@app.post("/push/stocks")
def push_stocks(payload: dict):
    """
    broadcast.py / GitHub Actions에서 종목명 업서트
    payload: {"items": [{"code":"9984","name":"ソフトバンクグループ",...}]}
    """
    items = payload.get("items", [])
    if not items:
        return {"ok": False, "msg": "empty"}

    upserted = 0
    with get_db() as conn:
        for item in items:
            code = item.get("code", "").strip()
            name = item.get("name", "").strip()
            if not code or not name or name == code:
                continue
            try:
                conn.execute("""
                    INSERT INTO stocks (code, name, name_short, market, sector, updated_at)
                    VALUES (?,?,?,?,?, datetime('now','localtime'))
                    ON CONFLICT(code) DO UPDATE SET
                        name       = excluded.name,
                        name_short = excluded.name_short,
                        market     = excluded.market,
                        sector     = excluded.sector,
                        updated_at = excluded.updated_at
                """, (
                    code,
                    name,
                    item.get("name_short", name[:6]),
                    item.get("market", ""),
                    item.get("sector", ""),
                ))
                upserted += 1
            except Exception as e:
                log.warning(f"push_stocks 저장 오류: {e}")
        conn.commit()

    return {"ok": True, "upserted": upserted, "total": len(items)}


@app.post("/push/news")
def push_news(payload: dict):
    """
    GitHub Actions에서 수집한 뉴스를 VPS DB에 저장
    payload: {"items": [...], "token": "..."}
    """
    # 토큰 검증
    if payload.get("token") != PUSH_TOKEN:
        return {"ok": False, "msg": "unauthorized"}
    items = payload.get("items", [])
    if not items:
        return {"ok": False, "msg": "empty"}

    saved = 0
    with get_db() as conn:
        for item in items:
            try:
                conn.execute("""
                    INSERT OR IGNORE INTO news_feed
                    (uid, title, summary, url, source, published_at,
                     age_min, stocks, sectors, score)
                    VALUES (?,?,?,?,?,?,?,?,?,?)
                """, (
                    item.get("uid", ""),
                    item.get("title", ""),
                    item.get("summary", ""),
                    item.get("url", ""),
                    item.get("source", ""),
                    item.get("published_at", ""),
                    item.get("age_min", 0),
                    json.dumps(item.get("stocks", []),  ensure_ascii=False),
                    json.dumps(item.get("sectors", []), ensure_ascii=False),
