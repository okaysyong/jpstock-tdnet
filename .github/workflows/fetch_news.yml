name: JP Stock News Fetcher

on:
  schedule:
    - cron: '*/5 * * * 1-5'
    - cron: '*/30 * * * 0,6'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser pytz beautifulsoup4 pypdf

      - name: Fetch and push news
        env:
          VPS_URL: ${{ secrets.VPS_URL }}
          VPS_TOKEN: ${{ secrets.VPS_TOKEN }}
        run: python fetch_news_worker.py

      - name: Collect TDnet disclosures
        env:
          VPS_NEWS_API_URL: ${{ secrets.VPS_NEWS_API_URL }}
          VPS_TOKEN: ${{ secrets.VPS_TOKEN }}
        run: python collect_tdnet.py

      - name: Parse disclosure PDFs
        env:
          VPS_NEWS_API_URL: ${{ secrets.VPS_NEWS_API_URL }}
          VPS_TOKEN: ${{ secrets.VPS_TOKEN }}
        run: python parse_disc_pdf.py
