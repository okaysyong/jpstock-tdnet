def _collector_loop():
    """RSS 뉴스 + 카부탄 + GPT 랭킹 주기적 수집 루프"""
    import time as _time
    log.info("✅ 수집 루프 시작")
    while True:
        try:
            fetch_rss()
        except Exception as e:
            log.warning(f"fetch_rss 오류: {e}")
        try:
            fetch_tdnet()
        except Exception as e:
            log.warning(f"fetch_tdnet 오류: {e}")
        try:
            fetch_kabutan()
        except Exception as e:
            log.warning(f"fetch_kabutan 오류: {e}")
        try:
            fetch_events_all()
        except Exception as e:
            log.warning(f"fetch_events_all 오류: {e}")
        try:
            run_gpt_ranking()
        except Exception as e:
