KABUTAN_HEADERS = {
    "User-Agent": (
        "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
        "AppleWebKit/537.36 (KHTML, like Gecko) "
        "Chrome/124.0.0.0 Safari/537.36"
    ),
    "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
    "Accept-Language": "ja,en-US;q=0.9,en;q=0.8",
    "Connection": "keep-alive",
}

KABUTAN_EXCLUDE = [
    "野球","サッカー","バスケット","テニス","芸能","タレント","アイドル",
    "ドラマ","映画","天皇","皇室","交通事故","火災","逮捕","仮想通貨",
]

KABUTAN_HIGH = [
    "業績修正","上方修正","下方修正","決算","TOB","買収",
    "増資","自社株買い","配当修正","社長交代","合併","分割","受注","特許",
]

KABUTAN_MEDIUM = [
    "売上","利益","成長","拡大","投資","開発","生産","輸出","輸入","市況","増収","増益",
]

def _kabutan_importance(title: str) -> int:
    for kw in KABUTAN_HIGH:
        if kw in title: return 3
    for kw in KABUTAN_MEDIUM:
        if kw in title: return 2
    return 1

def _kabutan_fetch_page(url: str) -> Optional[str]:
    try:
        r = requests.get(url, headers=KABUTAN_HEADERS, timeout=12, allow_redirects=True)
        r.raise_for_status()
        r.encoding = r.apparent_encoding or "utf-8"
        return r.text
    except Exception as e:
        log.warning(f"[카부탄] fetch 실패 {url[:60]}: {e}")
        return None

def _kabutan_parse_news(html: str, source: str) -> list:
    """카부탄 뉴스 목록 HTML에서 뉴스 파싱"""
    import hashlib as _hl
    results = []
    today = datetime.now(JST).strftime("%Y-%m-%d")

    SKIP_TITLES = {"マーケット","株式","ニュース","ランキング","続きを読む","もっと見る","一覧"}
    seen = set()

    # 패턴1: /news/marketnews/?&b=nXXXXXX 형태 (카부탄 시장뉴스)
    links1 = re.findall(
        r'href="(/news/marketnews/\?&b=[^"]+)"[^>]*>([^<]{8,150})',
        html
    )
    for href, title in links1:
        title = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', '', title)).strip()
        # [HH:MM] 시각 태그 제거
        title = re.sub(r'\s*\[\d{1,2}:\d{2}\]\s*$', '', title).strip()
        if not title or title in seen or len(title) < 8:
            continue
        if any(kw in title for kw in KABUTAN_EXCLUDE):
            continue
        seen.add(title)
        news_id = _hl.md5(f"market_{title}_{today}".encode()).hexdigest()[:12]
        results.append({
            "id":         news_id,
            "code":       "",
            "company":    "",
            "title":      title,
            "url":        f"https://kabutan.jp{href}",
            "time":       "",
            "date":       today,
            "source":     source,
            "importance": _kabutan_importance(title),
            "fetched_at": datetime.now(JST).strftime("%Y-%m-%d %H:%M"),
        })

    # 패턴2: /news/鍑... 형태 (종목뉴스, 결산 등)
    links2 = re.findall(
        r'href="(/news/[^"]{10,})"[^>]*>([^<]{8,150})',
        html
    )
    for href, title in links2:
        # marketnews는 이미 패턴1에서 처리
        if "marketnews" in href:
            continue
        title = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', '', title)).strip()
        title = re.sub(r'\s*\[\d{1,2}:\d{2}\]\s*$', '', title).strip()
        if not title or title in seen or len(title) < 8:
            continue
        if title in SKIP_TITLES:
            continue
        if any(kw in title for kw in KABUTAN_EXCLUDE):
            continue
        seen.add(title)

        code_m = re.search(r'[?&]code=(\d{4}[A-Z]?)', href)
        code = code_m.group(1) if code_m else ""

        news_id = _hl.md5(f"{code}_{title}_{today}".encode()).hexdigest()[:12]
        results.append({
            "id":         news_id,
            "code":       code,
            "company":    "",
            "title":      title,
            "url":        f"https://kabutan.jp{href}",
            "time":       "",
            "date":       today,
            "source":     source,
            "importance": _kabutan_importance(title),
            "fetched_at": datetime.now(JST).strftime("%Y-%m-%d %H:%M"),
        })

    return results

def fetch_kabutan() -> int:
    """카부탄 뉴스 수집 → stock_news DB 저장. 신규 건수 반환."""
    start = time.time()
    new_count = 0
    today = datetime.now(JST).strftime("%Y-%m-%d")
    cutoff_7d = (datetime.now(JST) - timedelta(days=7)).strftime("%Y-%m-%d")

    # 수집 URL 목록
    urls = [
        ("https://kabutan.jp/news/marketnews/",           "kabutan_market"),
        ("https://kabutan.jp/news/marketnews/?page=2",    "kabutan_market"),
        ("https://kabutan.jp/news/marketnews/?page=3",    "kabutan_market"),
        ("https://kabutan.jp/news/?category=0&page=1",   "kabutan_stock"),
        ("https://kabutan.jp/news/?category=2&page=1",   "kabutan_stock"),
        ("https://kabutan.jp/news/?category=3&page=1",   "kabutan_stock"),
    ]

    all_items = []
    for url, source in urls:
        html = _kabutan_fetch_page(url)
        if html:
            items = _kabutan_parse_news(html, source)
            all_items.extend(items)
        time.sleep(2)  # 카부탄 봇 감지 방지

    # 중복 제거
    seen_ids = set()
    unique = []
    for item in all_items:
        if item["id"] not in seen_ids:
            seen_ids.add(item["id"])
            unique.append(item)

    # DB 저장
    with get_db() as conn:
        # 7일 이상 오래된 종목뉴스 자동 삭제
        conn.execute("DELETE FROM stock_news WHERE date < ?", (cutoff_7d,))

        for item in unique:
            try:
                conn.execute("""
                    INSERT OR IGNORE INTO stock_news
                        (id, code, company, title, url, time, date,
                         source, category, importance, fetched_at)
                    VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                """, (
                    item["id"], item["code"], item["company"],
                    item["title"], item["url"], item["time"],
                    item["date"], item["source"], "",
                    item["importance"], item["fetched_at"],
                ))
                if conn.execute("SELECT changes()").fetchone()[0]:
                    new_count += 1
            except Exception as e:
                log.warning(f"[카부탄] DB 저장 오류: {e}")
        conn.commit()

    elapsed = time.time() - start
    log.info(f"  [카부탄] 신규 {new_count}건 / 총 {len(unique)}건 파싱 ({elapsed:.1f}초)")
    return new_count


