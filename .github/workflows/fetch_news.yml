@app.get("/news")
def get_news(
    max_items:   int   = Query(50,  ge=1, le=200),
    max_age_min: float = Query(1440, ge=1),  # 기본 24시간
    min_score:   float = Query(0.0, ge=0.0),
    stock_code:  Optional[str] = Query(None),
):
    """
    최신 뉴스 목록 반환
    - max_age_min: 최대 나이 (분), 기본 1440 = 24시간
    - min_score: 최소 중요도 점수 (0.0~1.0)
    - stock_code: 특정 종목 필터 (예: 6758)
    """
    cutoff = (datetime.now(JST) - timedelta(minutes=max_age_min)).strftime("%Y-%m-%d %H:%M:%S")

    with get_db() as conn:
        if stock_code:
            rows = conn.execute("""
                SELECT * FROM news_feed
                WHERE published_at >= ? AND score >= ?
                  AND stocks LIKE ?
                ORDER BY published_at DESC LIMIT ?
            """, (cutoff, min_score, f'%"{stock_code}"%', max_items)).fetchall()
        else:
            rows = conn.execute("""
                SELECT * FROM news_feed
                WHERE published_at >= ? AND score >= ?
                ORDER BY score DESC, published_at DESC LIMIT ?
            """, (cutoff, min_score, max_items)).fetchall()

    # 주식 무관 뉴스 서버사이드 필터
    _EXCL = [
        # 스포츠
        "ホームラン","マイナーリーグ","五輪","オリンピック","競馬",
        "ドジャース","レッドソックス","ロッキーズ","カブス","パドレス","ホワイトソックス",
        # 사건/사고/재해/인물 사망
        "死亡事故","初公判","検察.*スマホ","脇見運転",
        "死去", "議長が死","元.*死去","元.*逝去",
        "クマに襲","クマが","サグラダ","サプリメント",
        # 정치인 스캔들/동정
        "中傷動画","ひぼう中傷","秘書.*確信","動静.*年",
        # 정치 (주식 무관)
        "再審制度","皇位継承","憲法審査会","公職選挙法",
        # 기상/재해
        "激しい雨","落雷","台風","洪水","津波",
    ]
    import re as _re

    result = []
    for r in rows:
        d = dict(r)
        d["stocks"]  = json.loads(d["stocks"]  or "[]")
        d["sectors"] = json.loads(d["sectors"] or "[]")

        # 제외 키워드 체크
        title = d.get("title", "")
        if any(_re.search(kw, title) for kw in _EXCL):
            continue

        # broadcast.py 호환 필드 추가
        try:
            dt = datetime.strptime(d["published_at"], "%Y-%m-%d %H:%M:%S").replace(tzinfo=JST)
            d["time_str"] = dt.strftime("%H:%M")
            d["age_min"]  = round((datetime.now(JST) - dt).total_seconds() / 60, 1)
        except Exception:
            d["time_str"] = "--:--"
            d["age_min"]  = 999.0
        result.append(d)

    return {
        "count": len(result),
        "items": result,
        "gpt_world":   _gpt_rank_cache["world"],
        "gpt_japan":   _gpt_rank_cache["japan"],
        "gpt_updated": _gpt_rank_cache["updated_at"],
    }

@app.get("/tdnet")
def get_tdnet(
    hours:     float = Query(24.0, ge=0.5),  # 최근 N시간
    min_rank:  int   = Query(2,    ge=1, le=3),
    stock_code: Optional[str] = Query(None),
    unprocessed_only: bool = Query(False),
):
    """
    최신 공시 목록 반환
    - hours: 최근 N시간 이내 공시
    - min_rank: 최소 중요도 (2=일반, 3=긴급)
    - unprocessed_only: 미처리 공시만
    """
    cutoff = (datetime.now(JST) - timedelta(hours=hours)).strftime("%Y-%m-%d %H:%M:%S")

    with get_db() as conn:
        base_q = """
            SELECT * FROM company_disclosures
            WHERE disclosed_at >= ? AND rank >= ?
        """
        params = [cutoff, min_rank]
        if stock_code:
            base_q += " AND stock_code = ?"
            params.append(stock_code)
        if unprocessed_only:
            base_q += " AND is_processed = 0"
        base_q += " ORDER BY rank DESC, disclosed_at DESC LIMIT 100"

        rows = conn.execute(base_q, params).fetchall()

    return {"count": len(rows), "items": [dict(r) for r in rows]}

@app.post("/tdnet/{disclosure_id}/processed")
def mark_processed(disclosure_id: str):
