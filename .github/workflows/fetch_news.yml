    return {"ok": True, "saved": saved, "total": len(items)}


@app.get("/api/events")
def get_events(
    date_from: Optional[str] = Query(None),   # YYYY-MM-DD (없으면 오늘)
    date_to:   Optional[str] = Query(None),   # YYYY-MM-DD (없으면 +35일)
    country:   Optional[str] = Query(None),   # JP / US
    category:  Optional[str] = Query(None),   # economic / sq / boj
    min_stars: int           = Query(1, ge=1, le=5),
    limit:     int           = Query(100, ge=1, le=500),
):
    """이벤트 조회 (경제지표 / SQ / 日銀)"""
    now_jst = datetime.now(JST)
    if not date_from:
        date_from = now_jst.strftime("%Y-%m-%d")
    if not date_to:
        date_to = (now_jst + timedelta(days=35)).strftime("%Y-%m-%d")

    conditions = ["event_date >= ?", "event_date <= ?", "stars >= ?"]
    params: list = [date_from, date_to, min_stars]

    if country:
        conditions.append("country = ?")
        params.append(country)
    if category:
        conditions.append("category = ?")
        params.append(category)

    where = " AND ".join(conditions)
    params.append(limit)

    with get_db() as conn:
        rows = conn.execute(f"""
            SELECT * FROM events
            WHERE {where}
            ORDER BY event_date ASC, event_time ASC, stars DESC
            LIMIT ?
        """, params).fetchall()

    return {"ok": True, "count": len(rows), "events": [dict(r) for r in rows]}


@app.get("/api/events/today")
def get_events_today():
    """오늘 + 내일 + 주말이면 직전 영업일 이벤트 — JP★2+, US★3+, 기타★4+"""
    now_jst  = datetime.now(JST)
    today    = now_jst.strftime("%Y-%m-%d")
    tomorrow = (now_jst + timedelta(days=1)).strftime("%Y-%m-%d")
    weekday  = now_jst.weekday()
    if weekday == 5:
        prev_biz = (now_jst - timedelta(days=1)).strftime("%Y-%m-%d")
    elif weekday == 6:
        prev_biz = (now_jst - timedelta(days=2)).strftime("%Y-%m-%d")
    else:
        prev_biz = None

    date_list = list({today, tomorrow} | ({prev_biz} if prev_biz else set()))
    placeholders = ",".join("?" * len(date_list))

    with get_db() as conn:
        rows = conn.execute(f"""
            SELECT * FROM events
            WHERE event_date IN ({placeholders})
              AND (
                (country = 'JP' AND stars >= 2) OR
                (country = 'US' AND stars >= 3) OR
                (country NOT IN ('JP','US') AND stars >= 4)
              )
            ORDER BY event_date ASC, event_time ASC, stars DESC
        """, date_list).fetchall()

    events = [dict(r) for r in rows]

    seen = {}
    for ev in events:
        key = f"{ev['event_date']}_{ev['event_time']}_{ev.get('title','')}"
        if key not in seen:
            seen[key] = ev
        else:
            cur = seen[key]
            if ev.get('actual') and not cur.get('actual'):
                seen[key] = ev

    deduped = sorted(seen.values(), key=lambda x: (x['event_date'], x['event_time'], -x['stars']))

    filtered = []
    for ev in deduped:
        ed = ev["event_date"]
        et = ev.get("event_time") or "00:00"
        if ed == today:
            filtered.append(ev)
        elif prev_biz and ed == prev_biz and ev.get("actual"):
            filtered.append(ev)
        elif ed == tomorrow and et < "09:00":
            filtered.append(ev)

    return {"ok": True, "count": len(filtered), "events": filtered}

@app.post("/push/events")
def push_events(payload: dict):
    """broadcast.py에서 이벤트 실제값(actual) 업데이트 수신"""
    items = payload.get("events", [])
    if not items:
        return {"ok": False, "msg": "empty"}

    updated = 0
    now_jst = datetime.now(JST)
    with get_db() as conn:
        for item in items:
            ev_id  = item.get("id", "")
            actual = item.get("actual")
            if not ev_id or actual is None:
                continue
            conn.execute("""
                UPDATE events SET
                    actual=?, is_released=1,
                    updated_at=datetime('now','localtime')
                WHERE id=?
            """, (str(actual), ev_id))
            if conn.execute("SELECT changes()").fetchone()[0]:
                updated += 1
        conn.commit()

    log.info(f"[이벤트] actual 업데이트 {updated}건")
    return {"ok": True, "updated": updated}


@app.post("/push/stock_news")
def push_stock_news(payload: dict):
    """
    GitHub Actions collect_stock_news.py → 카부탄 종목뉴스 수신 및 DB 저장
    payload: {"news": [...], "count": N, "fetched_at": "..."}
    """
    news_items = payload.get("news", [])
    if not isinstance(news_items, list) or not news_items:
        return {"ok": False, "msg": "empty"}

    inserted = 0
    skipped  = 0

    today_jst = datetime.now(JST).strftime("%Y-%m-%d")
    cutoff_7d = (datetime.now(JST) - timedelta(days=7)).strftime("%Y-%m-%d")

    with get_db() as conn:
        # 7일 이상 오래된 종목뉴스 자동 삭제
        conn.execute("DELETE FROM stock_news WHERE date < ?", (cutoff_7d,))

        for item in news_items:
            try:
                conn.execute("""
                    INSERT OR IGNORE INTO stock_news
                        (id, code, company, title, url, time, date,
                         source, category, importance, fetched_at)
                    VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                """, (
                    item.get("id", ""),
                    item.get("code", ""),
                    item.get("company", ""),
                    item.get("title", ""),
                    item.get("url", ""),
                    item.get("time", ""),
                    item.get("date", today_jst),
                    item.get("source", "kabutan_stock"),
                    item.get("category", ""),
                    item.get("importance", 1),
                    item.get("fetched_at", ""),
                ))
                if conn.execute("SELECT changes()").fetchone()[0]:
                    inserted += 1
                else:
                    skipped += 1
            except Exception as e:
                log.warning(f"push_stock_news 저장 오류: {e}")
        conn.commit()

    sources = payload.get("sources", {})
    log.info(f"[stock_news] 수신 {len(news_items)}건 → 신규 {inserted}건 (시장:{sources.get('market',0)} 종목:{sources.get('stock',0)} 테마:{sources.get('theme',0)})")
    return {"ok": True, "inserted": inserted, "skipped": skipped, "total": len(news_items)}


@app.get("/api/global_quotes")
def get_global_quotes():
    """글로벌 지수 Yahoo Finance 프록시 (CORS 우회)"""
    syms = "^NDX,^GSPC,000001.SS,^NVI,DX-Y.NYB,^VIX"  # ^JTIY는 Yahoo spark 미지원
    try:
        res = requests.get(
            f"https://query2.finance.yahoo.com/v8/finance/spark?symbols={syms}&range=1d&interval=5m",
            headers={"User-Agent": "Mozilla/5.0"},
            timeout=8
        )
        data = res.json() if res.status_code == 200 else {}

        # 일본 국채 10년 별도 조회 (^JTIY)
        try:
            r2 = requests.get(
                "https://query1.finance.yahoo.com/v8/finance/chart/%5EJTIY?interval=5m&range=1d",
                headers={"User-Agent": "Mozilla/5.0"},
                timeout=8
            )
            if r2.status_code == 200:
                j = r2.json()
                result = j.get("chart",{}).get("result",[])
                if result:
                    closes = [x for x in (result[0].get("indicators",{}).get("quote",[{}])[0].get("close",[]) or []) if x]
                    prev = result[0].get("meta",{}).get("previousClose",0)
                    if closes:
                        data["^JTIY"] = {
                            "symbol": "^JTIY",
                            "close": closes,
                            "previousClose": prev,
                            "chartPreviousClose": prev
                        }
        except Exception:
            pass

        return data if data else {"error": "no data"}
    except Exception as e:
        return {"error": str(e)}


@app.get("/api/stock_news")
def get_stock_news(
    code:    Optional[str] = Query(None),       # 특정 종목 코드
    date:    Optional[str] = Query(None),       # YYYY-MM-DD (없으면 오늘)
    min_imp: int           = Query(1, ge=1, le=3),
    source:  Optional[str] = Query(None),       # kabutan_stock / kabutan_market / kabutan_theme
    limit:   int           = Query(50, ge=1, le=200),
):
    """종목뉴스 조회 (broadcast.py / HTML 조회용)"""
    if not date:
        date = datetime.now(JST).strftime("%Y-%m-%d")

    conditions = ["date >= ?", "importance >= ?"]
    params: list = [date, min_imp]

    if code:
        conditions.append("code = ?")
        params.append(code)
    if source:
        conditions.append("source = ?")
        params.append(source)

    where = " AND ".join(conditions)
    params.append(limit)

    with get_db() as conn:
        rows = conn.execute(f"""
            SELECT * FROM stock_news
            WHERE {where}
            ORDER BY importance DESC, date DESC, time DESC
            LIMIT ?
        """, params).fetchall()

    return {"ok": True, "count": len(rows), "news": [dict(r) for r in rows]}


@app.get("/api/stock_news/codes")
def get_stock_news_codes(date: Optional[str] = Query(None)):
    """오늘 뉴스가 있는 종목 코드 목록 + 건수 요약 (해설 대상 종목 선별용)"""
    if not date:
        date = datetime.now(JST).strftime("%Y-%m-%d")

    with get_db() as conn:
        rows = conn.execute("""
            SELECT code, company,
                   COUNT(*) as total,
                   MAX(importance) as max_imp,
                   MAX(time) as latest_time
            FROM stock_news
            WHERE date >= ? AND code != ''
            GROUP BY code
            ORDER BY max_imp DESC, total DESC
        """, (date,)).fetchall()

    return {
        "ok": True,
        "count": len(rows),
        "codes": [
            {
                "code":           r[0],
                "company":        r[1],
                "count":          r[2],
                "max_importance": r[3],
                "latest_time":    r[4],
            }
            for r in rows
        ]
    }


@app.post("/push/tdnet")
def push_tdnet(payload: dict):
    """
    broadcast.py에서 수집한 공시를 VPS DB에 저장
    + news_feed에도 동시 저장 (종목별 뉴스 매칭용)
    payload: {"items": [...]}
    """
    items = payload.get("items", [])
    if not items:
        return {"ok": False, "msg": "empty"}

    saved = 0
    news_saved = 0
    now_jst = datetime.now(JST)

    with get_db() as conn:
        for item in items:
            try:
                # ① company_disclosures 저장
                conn.execute("""
                    INSERT OR IGNORE INTO company_disclosures
                    (disclosure_id, stock_code, company_name, title,
                     disclosed_at, rank, pdf_url)
                    VALUES (?,?,?,?,?,?,?)
                """, (
                    item.get("disclosure_id", ""),
                    item.get("stock_code", ""),
                    item.get("company_name", ""),
                    item.get("title", ""),
                    item.get("disclosed_at", ""),
                    item.get("rank", 1),
                    item.get("pdf_url", ""),
                ))
                if conn.execute("SELECT changes()").fetchone()[0]:
                    saved += 1

                    # ② rank 2 이상 공시는 news_feed에도 저장 (종목별 뉴스로 활용)
                    if item.get("rank", 1) >= 2:
                        import hashlib as _hl
                        code    = item.get("stock_code", "")
                        name    = item.get("company_name", "")
                        title   = item.get("title", "")
                        disc_id = item.get("disclosure_id", "")
                        news_uid = _hl.md5(f"tdnet_{disc_id}".encode()).hexdigest()[:12]

                        # score: rank3=0.8, rank2=0.5
                        score = 0.8 if item.get("rank", 1) >= 3 else 0.5

                        conn.execute("""
                            INSERT OR IGNORE INTO news_feed
                            (uid, title, summary, url, source, published_at,
                             age_min, stocks, sectors, score)
                            VALUES (?,?,?,?,?,?,?,?,?,?)
                        """, (
                            news_uid,
                            f"【適時開示】{name} {title}",
                            f"{name}が{title}を発表しました。",
                            item.get("pdf_url", ""),
                            "TDnet/カブタン",
                            item.get("disclosed_at", now_jst.strftime("%Y-%m-%d %H:%M:%S")),
                            round((now_jst - datetime.strptime(
                                item.get("disclosed_at", now_jst.strftime("%Y-%m-%d %H:%M:%S")),
                                "%Y-%m-%d %H:%M:%S"
                            ).replace(tzinfo=JST)).total_seconds() / 60, 1) if item.get("disclosed_at") else 0,
                            json.dumps([code], ensure_ascii=False),
                            json.dumps([], ensure_ascii=False),
                            score,
                        ))
                        if conn.execute("SELECT changes()").fetchone()[0]:
                            news_saved += 1

            except Exception as e:
                log.warning(f"push_tdnet 저장 오류: {e}")
        conn.commit()

    return {"ok": True, "saved": saved, "news_saved": news_saved, "total": len(items)}



    """수집 통계"""
    with get_db() as conn:
        news_today = conn.execute(
            "SELECT COUNT(*) FROM news_feed WHERE DATE(published_at) = DATE('now','localtime')"
        ).fetchone()[0]
        disc_today = conn.execute(
            "SELECT COUNT(*) FROM company_disclosures WHERE DATE(disclosed_at) = DATE('now','localtime')"
        ).fetchone()[0]
        recent_logs = conn.execute(
            "SELECT job_name, status, count, started_at FROM scheduler_logs ORDER BY id DESC LIMIT 10"
        ).fetchall()
    return {
        "news_today":  news_today,
        "disc_today":  disc_today,
        "recent_logs": [dict(r) for r in recent_logs],
    }

