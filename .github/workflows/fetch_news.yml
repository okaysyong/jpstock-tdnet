def _news_uid(url: str) -> str:
    return hashlib.md5(url.encode()).hexdigest()[:12]

def _score_news(title: str, matched_stocks: list, matched_sectors: list, age_min: float) -> float:
    score = 0.0
    for kw in HIGH_KW:
        if kw in title:
            score += 0.2
    score += 0.15 * len(matched_stocks)
    score += 0.10 * len(matched_sectors)
    if age_min < 15:
        score += 0.3
    elif age_min < 30:
        score += 0.1
    return min(round(score, 2), 1.0)

def fetch_rss() -> int:
    """RSS 피드 수집 → DB 저장. 신규 건수 반환."""
    start = time.time()
    new_count = 0

    for url in RSS_FEEDS:
        try:
            res = requests.get(
                url,
                headers={"User-Agent": "Mozilla/5.0 (compatible; JPMarketLive/1.0)"},
                timeout=10
            )
            items = _parse_rss(res.text, url)

            with get_db() as conn:
                for item in items:
                    # 제외 키워드 필터
                    if any(kw in item["title"] for kw in EXCLUDE_KW):
                        continue
                    try:
                        conn.execute("""
                            INSERT OR IGNORE INTO news_feed
                            (uid, title, summary, url, source, published_at,
                             age_min, stocks, sectors, score)
                            VALUES (?,?,?,?,?,?,?,?,?,?)
                        """, (
                            item["uid"], item["title"], item["summary"],
                            item["url"], item["source"],
                            item["dt"].strftime("%Y-%m-%d %H:%M:%S"),
                            item["age_min"],
                            json.dumps(item["stocks"],  ensure_ascii=False),
                            json.dumps(item["sectors"], ensure_ascii=False),
                            item["score"],
                        ))
                        if conn.execute("SELECT changes()").fetchone()[0]:
                            new_count += 1
                    except Exception as e:
                        log.warning(f"뉴스 DB 저장 오류: {e}")
                conn.commit()
        except Exception as e:
            log.warning(f"RSS 수집 오류 ({url}): {e}")

    elapsed = time.time() - start
    log.info(f"  [RSS] 신규 {new_count}건 ({elapsed:.1f}초)")
    return new_count

def _parse_rss(xml_text: str, source: str) -> list:
    """RSS XML 파싱 (feedparser 우선, ET 폴백)."""
    now_jst = datetime.now(JST)
    entries = []

    try:
        import feedparser
        feed = feedparser.parse(xml_text)
        entries = feed.entries
    except ImportError:
        import xml.etree.ElementTree as ET
        xml_text = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', '', xml_text)
        try:
            root = ET.fromstring(xml_text)
            ch   = root.find("channel")
            raw  = ch.findall("item") if ch is not None else []
        except Exception:
            return []

        class _FE:
            def __init__(self, el):
                self.title     = (el.findtext("title") or "").strip()
                self.link      = (el.findtext("link")  or "").strip()
                self.published = (el.findtext("pubDate") or "")
        entries = [_FE(el) for el in raw]

    items = []
    for e in entries:
        title = (getattr(e, "title", "") or "").strip()
        link  = (getattr(e, "link",  "") or "").strip()
        pub   = (getattr(e, "published", "") or getattr(e, "updated", "") or "")
        if not title or not link:
            continue

        try:
            from email.utils import parsedate_to_datetime
            dt = parsedate_to_datetime(pub).astimezone(JST)
        except Exception:
            try:
                import calendar
                st = getattr(e, "published_parsed", None) or getattr(e, "updated_parsed", None)
                dt = datetime.fromtimestamp(calendar.timegm(st), tz=JST) if st else now_jst
            except Exception:
                dt = now_jst

        uid     = _news_uid(link)
        age_min = (now_jst - dt).total_seconds() / 60
        if age_min > 1440 * 30:  # 30일 이상 오래된 뉴스 스킵
            continue

        matched_stocks  = [c for c, kws in STOCK_KW.items()  if any(k in title for k in kws)]
        matched_sectors = [s for s, kws in SECTOR_KW.items() if any(k in title for k in kws)]
        score = _score_news(title, matched_stocks, matched_sectors, age_min)

        summary_raw = (getattr(e, "summary", "") or getattr(e, "description", "") or "").strip()
        summary = re.sub(r'<[^>]+>', '', summary_raw)[:150].strip()
        if summary == title:
            summary = ""

        items.append({
            "uid": uid, "title": title, "summary": summary,
            "url": link, "source": source, "dt": dt,
            "age_min": round(age_min, 1),
            "stocks": matched_stocks, "sectors": matched_sectors,
            "score": score,
        })

    return items

