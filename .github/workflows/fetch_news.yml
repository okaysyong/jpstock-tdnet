        );
        """)
        conn.commit()
    log.info(f"✅ DB 초기화 완료: {DB_PATH}")

@contextmanager
def get_db():
    conn = sqlite3.connect(DB_PATH, timeout=10)
    conn.row_factory = sqlite3.Row
    try:
        yield conn
    finally:
        conn.close()

