def init_db():
    with sqlite3.connect(DB_PATH) as conn:
        conn.executescript("""
        CREATE TABLE IF NOT EXISTS news_feed (
            uid          TEXT PRIMARY KEY,
            title        TEXT NOT NULL,
            summary      TEXT DEFAULT '',
            url          TEXT NOT NULL,
            source       TEXT DEFAULT '',
            published_at TEXT NOT NULL,
            age_min      REAL DEFAULT 0,
            stocks       TEXT DEFAULT '[]',
            sectors      TEXT DEFAULT '[]',
            score        REAL DEFAULT 0,
            created_at   TEXT DEFAULT (datetime('now','localtime'))
        );
        CREATE INDEX IF NOT EXISTS idx_news_published ON news_feed(published_at DESC);
        CREATE INDEX IF NOT EXISTS idx_news_score     ON news_feed(score DESC);

        CREATE TABLE IF NOT EXISTS company_disclosures (
            disclosure_id   TEXT PRIMARY KEY,
            stock_code      TEXT NOT NULL,
            company_name    TEXT DEFAULT '',
            title           TEXT NOT NULL,
            disclosed_at    TEXT NOT NULL,
            rank            INTEGER DEFAULT 1,
            pdf_url         TEXT DEFAULT '',
            is_processed    INTEGER DEFAULT 0,
            created_at      TEXT DEFAULT (datetime('now','localtime'))
        );
        CREATE INDEX IF NOT EXISTS idx_disc_stock ON company_disclosures(stock_code);
        CREATE INDEX IF NOT EXISTS idx_disc_rank  ON company_disclosures(rank DESC, disclosed_at DESC);

        CREATE TABLE IF NOT EXISTS stocks (
            code         TEXT PRIMARY KEY,
            name         TEXT NOT NULL,
            name_short   TEXT DEFAULT '',
