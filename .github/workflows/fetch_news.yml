name: JP Stock News Fetcher

on:
  schedule:
    - cron: '*/5 0-7 * * 1-5'
    - cron: '0 */3 * * 0,6'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser pytz

      - name: Fetch and push news
        env:
          VPS_URL: ${{ secrets.VPS_URL }}
          VPS_TOKEN: ${{ secrets.VPS_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import requests, feedparser, json, time, hashlib, os
          from datetime import datetime, timezone, timedelta

          JST = timezone(timedelta(hours=9))
          VPS_URL = os.environ.get("VPS_URL", "https://jpstocklive.com")
          VPS_TOKEN = os.environ.get("VPS_TOKEN", "")

          RSS_FEEDS = [
              ("yahoo_finance", "https://finance.yahoo.co.jp/rss/news"),
              ("yahoo_biz", "https://news.yahoo.co.jp/rss/topics/business.xml"),
              ("yahoo_stock", "https://news.yahoo.co.jp/rss/topics/stock.xml"),
              ("nhk_cat4", "https://www.nhk.or.jp/rss/news/cat4.xml"),
              ("nhk_cat5", "https://www.nhk.or.jp/rss/news/cat5.xml"),
              ("nhk_cat7", "https://www.nhk.or.jp/rss/news/cat7.xml"),
              ("minkabu", "https://minkabu.jp/news/rss"),
              ("reuters_jp", "https://jp.reuters.com/rssFeed/businessNews"),
          ]

          EXCLUDE_KW = [
              "サッカー","野球","バスケ","テニス","ゴルフ","ラグビー","五輪",
              "オリンピック","W杯","ワールドカップ","高校野球","Jリーグ","プロ野球",
              "大リーグ","MLB","NFL","NBA","ドジャース","ヤンキース",
              "大谷","佐々木朗","鈴木誠","松井裕","ホームラン","打点","登板",
              "大相撲","力士","横綱","金メダル","銀メダル","マラソン","駅伝",
              "パドレス","カブス","アストロズ","ホワイトソックス","ブルージェイズ",
              "芸能","アイドル","歌手","俳優","映画","ドラマ","コンサート",
              "台風","大雨","洪水","土砂","ひょう","雷","竜巻","熱中症","梅雨",
              "交通事故","火災","逮捕","容疑者","殺人","詐欺被害","強盗",
              "行方不明","死亡事故","遺体",
              "表敬訪問","記念式典","慰霊","追悼","演説","到着","出発",
              "天皇","皇后","皇室","陛下","皇太子","皇族",
              "グルメ","食べ歩き","観光","旅行","温泉","スイーツ",
          ]

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; JPStockLiveBot/1.0)",
              "Accept": "application/rss+xml, application/xml, text/xml, */*",
          }

          all_news = []
          for source, url in RSS_FEEDS:
              try:
                  r = requests.get(url, timeout=10, headers=headers)
                  if r.status_code != 200:
                      print(f"SKIP {source}: {r.status_code}")
                      continue
                  feed = feedparser.parse(r.text)
                  count = 0
                  for entry in feed.entries[:30]:
                      title = (entry.get("title") or "").strip()
                      if not title:
                          continue
                      if any(kw in title for kw in EXCLUDE_KW):
                          continue
                      uid = hashlib.md5(f"{source}:{title}".encode()).hexdigest()[:16]
                      try:
                          published = datetime(*entry.published_parsed[:6], tzinfo=timezone.utc).astimezone(JST).strftime("%Y-%m-%d %H:%M:%S")
                      except:
                          published = datetime.now(JST).strftime("%Y-%m-%d %H:%M:%S")
                      all_news.append({
                          "uid": uid,
                          "title": title,
                          "summary": (entry.get("summary") or "")[:300],
                          "url": entry.get("link") or "",
                          "source": source,
                          "published_at": published,
                      })
                      count += 1
                  print(f"OK {source}: {count}")
              except Exception as e:
                  print(f"ERR {source}: {e}")
              time.sleep(1)

          print(f"Total: {len(all_news)}")
          if not all_news:
              print("No news")
              exit(0)

          try:
              res = requests.post(
                  f"{VPS_URL}/push/news",
                  json={"items": all_news, "token": VPS_TOKEN},
                  timeout=15,
              )
              print(f"VPS: {res.status_code} {res.text[:100]}")
          except Exception as e:
              print(f"VPS ERR: {e}")
          PYEOF
