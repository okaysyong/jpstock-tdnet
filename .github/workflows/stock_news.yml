name: Kabutan Stock News Collector

on:
  schedule:
    # 매 5분마다 실행 (JST 09:00~17:30 = UTC 00:00~08:30)
    # GitHub Actions는 UTC 기준
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 0-8 * * 1-5'
    # 미국장 시간대 (JST 22:00~06:00 = UTC 13:00~21:00) - 30분마다
    - cron: '0,30 13-21 * * 1-5'
    # 장 전 (JST 07:00~09:00 = UTC 22:00~00:00) - 10분마다
    - cron: '0,10,20,30,40,50 22-23 * * 0-4'

  # 수동 실행
  workflow_dispatch:
    inputs:
      top_codes:
        description: '거래대금 상위 종목 코드 (쉼표구분, 예: 6857,8035,9984)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pip 설치 없이 표준 라이브러리만 사용 (urllib)

      - name: Run stock news collector
        env:
          VPS_URL: ${{ secrets.VPS_URL }}
          VPS_SECRET: ${{ secrets.VPS_SECRET }}
          TOP_CODES: ${{ github.event.inputs.top_codes }}
        run: |
          python collect_stock_news.py

      - name: Report result
        if: always()
        run: |
          echo "수집 완료: $(date '+%Y-%m-%d %H:%M UTC')"
