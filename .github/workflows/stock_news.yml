name: Kabutan Stock News Collector

on:
  schedule:
    # 일본장 시간 (JST 09:00~15:30 = UTC 00:00~06:30) — 5분마다
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 0-6 * * 1-5'
    # 미국장 시간 (JST 22:30~05:00 = UTC 13:30~20:00) — 30분마다
    - cron: '0,30 13-20 * * 1-5'

  workflow_dispatch:
    inputs:
      top_codes:
        description: '종목 코드 (쉼표구분, 예: 6857,8035,9984)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stock news collector
        env:
          VPS_URL: "https://jpstocklive.com"
          VPS_SECRET: ""
          TOP_CODES: ${{ github.event.inputs.top_codes }}
        run: |
          python collect_stock_news.py

      - name: Report result
        if: always()
        run: |
          echo "완료: $(date '+%Y-%m-%d %H:%M UTC')"
