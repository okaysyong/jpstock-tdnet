name: Stock news collector
on:
  schedule:
    - cron: '7,22,37,52 0-9 * * 1-5'
    - cron: '7,22,37,52 22-23 * * 0-4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.lock.txt
      - run: python collect_stock_news.py
        env:
          VPS_URL: https://jpstocklive.com
          VPS_PUSH_TOKEN: ${{ secrets.VPS_PUSH_TOKEN || secrets.VPS_PUSH_SECRET || secrets.VPS_TOKEN }}
