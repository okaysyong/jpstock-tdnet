name: Kabutan Stock News Collector

on:
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 0-6 * * 1-5'
    - cron: '0,30 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      top_codes:
        description: 'Stock codes comma separated'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        env:
          VPS_URL: https://jpstocklive.com
          VPS_SECRET: ''
          TOP_CODES: ${{ github.event.inputs.top_codes }}
        run: python collect_stock_news.py

      - name: Done
        if: always()
        run: echo "Done $(date)"
