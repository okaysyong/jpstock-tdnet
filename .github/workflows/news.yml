name: News Collect

on:
  schedule:
    # 5분마다 24시간
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Collect news
        env:
          VPS_NEWS_API_URL: ${{ secrets.VPS_NEWS_API_URL }}
        run: python collect_news.py
