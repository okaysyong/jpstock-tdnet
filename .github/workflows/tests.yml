name: Collector tests and VPS verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.lock.txt
      - run: python -m unittest discover -s tests -v
  application-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      VPS_URL: https://jpstocklive.com
      VPS_BASE_URL: https://jpstocklive.com
      VPS_NEWS_API_URL: https://jpstocklive.com
      VPS_PUSH_TOKEN: ${{ secrets.VPS_PUSH_TOKEN || secrets.VPS_PUSH_SECRET || secrets.VPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.lock.txt
      - name: Verify protected VPS authentication without saving records
        run: python verify_vps_ingest.py
      - name: Collect actual RSS news
        run: python fetch_news_worker.py
      - name: Collect actual TDnet disclosures
        run: python collect_tdnet.py
      - name: Collect actual economic calendar
        run: python collect_calendar.py
      - name: Collect actual earnings calendar
        run: python fetch_kessan.py
  market-news-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      VPS_URL: https://jpstocklive.com
      VPS_NEWS_API_URL: https://jpstocklive.com
      VPS_PUSH_TOKEN: ${{ secrets.VPS_PUSH_TOKEN || secrets.VPS_PUSH_SECRET || secrets.VPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.lock.txt
      - name: Collect actual Kabutan news
        id: kabutan_direct
        continue-on-error: true
        run: python collect_kabutan.py
      - name: Verify recent VPS execution after direct Kabutan collection failed
        if: steps.kabutan_direct.outcome == 'failure'
        run: python verify_vps_source.py --source kabutan
      - name: Collect actual source-dated stock news
        id: stock_news_direct
        continue-on-error: true
        if: always()
        run: python collect_stock_news.py
      - name: Verify recent VPS execution after direct stock-news collection failed
        if: always() && steps.stock_news_direct.outcome == 'failure'
        run: python verify_vps_source.py --source kabutan
  theme-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      VPS_NEWS_API_URL: https://jpstocklive.com
      VPS_PUSH_TOKEN: ${{ secrets.VPS_PUSH_TOKEN || secrets.VPS_PUSH_SECRET || secrets.VPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.lock.txt
      - name: Collect and save a bounded actual stock-theme sample
        id: theme_direct
        continue-on-error: true
        run: |
          python - <<'PY'
          import collect_themes as source
          available = set(source.get_all_codes_from_vps())
          codes = [code for code in ('7203', '6758', '9984') if code in available]
          if not codes:
              raise RuntimeError('Theme validation sample is missing from stock master')
          items = [{'code': code, 'themes': source.fetch_kabutan_themes(code), 'source': 'kabutan'} for code in codes]
          result = source.push_to_vps(items)
          print('Theme sample collected=' + str(len(items)) + ', saved=' + str(result.get('saved', 0)))
          PY
      - name: Verify recent VPS execution after direct theme collection failed
        if: steps.theme_direct.outcome == 'failure'
        run: python verify_vps_source.py --source push_themes
