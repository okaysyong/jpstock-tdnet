name: TDnet Collect
on:
  schedule:
    - cron: '2-59/5 0-9 * * 1-5'
    - cron: '2-59/5 23 * * 0-4'
    - cron: '2-59/30 10-22 * * *'
    - cron: '2-59/30 0-9 * * 0,6'
    - cron: '2-59/30 23 * * 5,6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tdnet-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.lock.txt
      - run: python collect_tdnet.py
        env:
          VPS_NEWS_API_URL: https://jpstocklive.com
          VPS_PUSH_TOKEN: ${{ secrets.VPS_PUSH_TOKEN || secrets.VPS_PUSH_SECRET || secrets.VPS_TOKEN }}
      - run: python parse_disc_pdf.py
        env:
          VPS_NEWS_API_URL: https://jpstocklive.com
          VPS_PUSH_TOKEN: ${{ secrets.VPS_PUSH_TOKEN || secrets.VPS_PUSH_SECRET || secrets.VPS_TOKEN }}
