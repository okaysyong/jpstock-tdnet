name: TDnet Collect
on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run TDnet collector
        env:
          VPS_NEWS_API_URL: ${{ secrets.VPS_NEWS_API_URL }}
          VPS_TOKEN: ${{ secrets.VPS_TOKEN }}
        run: python collect_tdnet.py
