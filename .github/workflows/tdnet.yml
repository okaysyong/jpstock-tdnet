name: TDnet Collect

on:
  schedule:
    # 09:00~16:30 JST = 00:00~07:30 UTC, 평일(월-금), 5분마다
    - cron: '*/5 0-7 * * 1-5'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run TDnet collector
        env:
          VPS_NEWS_API_URL: ${{ secrets.VPS_NEWS_API_URL }}
          VPS_TOKEN: ${{ secrets.VPS_TOKEN }}
        run: python collect_tdnet.py
