name: TDnet Collect

on:
  schedule:
    # 09:00~16:00 JST = 00:00~07:00 UTC, 평일(월-금), 10분마다
    - cron: '*/10 0-7 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run TDnet collector
        env:
          VPS_NEWS_API_URL: ${{ secrets.VPS_NEWS_API_URL }}
        run: python collect_tdnet.py
