name: Collect Stock Themes
on:
  schedule:
    - cron: '32 23,5,11,17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-themes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.lock.txt
      - run: python collect_themes.py
        env:
          VPS_NEWS_API_URL: https://jpstocklive.com
          VPS_PUSH_TOKEN: ${{ secrets.VPS_PUSH_TOKEN || secrets.VPS_PUSH_SECRET || secrets.VPS_TOKEN }}
