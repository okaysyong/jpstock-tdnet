name: ForexFactory Calendar Push

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push-events:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Events & Push to VPS
        run: |
          python3 << 'PYEOF'
          import requests, json, re
          from datetime import datetime, timezone, timedelta, date

          JST = timezone(timedelta(hours=9))
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          # ── 1. ForexFactory (forecast/previous/시간) ──
          ff_items = []
          for url in [
              "https://nfs.faireconomy.media/ff_calendar_thisweek.json",
              "https://nfs.faireconomy.media/ff_calendar_nextweek.json",
          ]:
              try:
                  r = requests.get(url, headers=headers, timeout=15)
                  if r.status_code == 200:
                      ff_items.extend(r.json())
                      print(f"FF OK {url.split('/')[-1]}: {len(r.json())}건")
                  else:
                      print(f"FF NG {url.split('/')[-1]}: {r.status_code}")
              except Exception as e:
                  print(f"FF error: {e}")

          # ── 2. investing.com 경제 캘린더 (actual 값) ──
          actual_map = {}  # "YYYY-MM-DD|이벤트명" → actual 값
          try:
              today = date.today().isoformat()
              inv_url = f"https://www.investing.com/economic-calendar/Service/getCalendarFilteredData"
              inv_headers = {
                  **headers,
                  "X-Requested-With": "XMLHttpRequest",
                  "Referer": "https://www.investing.com/economic-calendar/",
              }
              inv_data = {
                  "country[]": ["35", "72"],  # 35=JP, 72=US
                  "importance[]": ["2", "3"],  # Medium, High
                  "timeZone": "18",  # JST
                  "timeFilter": "timeRemain",
                  "currentTab": "today",
                  "submitFilters": "1",
                  "limit_from": "0",
              }
              inv_r = requests.post(inv_url, headers=inv_headers, data=inv_data, timeout=15)
              print(f"Investing.com status: {inv_r.status_code}")
              if inv_r.status_code == 200:
                  print(f"Investing.com 응답: {inv_r.text[:300]}")
          except Exception as e:
              print(f"Investing.com error: {e}")

          # ── 3. ForexFactory 필터 + push ──
          TARGET_COUNTRIES = {"USD", "JPY"}
          TARGET_IMPACTS   = {"High", "Medium"}
          filtered = [
              ev for ev in ff_items
              if ev.get("country","") in TARGET_COUNTRIES
              and ev.get("impact","") in TARGET_IMPACTS
          ]
          print(f"FF 필터 후: {len(filtered)}건")

          def parse_jst(date_str):
              try:
                  dt = datetime.fromisoformat(date_str)
                  dt_jst = dt.astimezone(JST)
                  return dt_jst.strftime("%Y-%m-%d"), dt_jst.strftime("%H:%M")
              except Exception:
                  return date_str[:10], date_str[11:16] if len(date_str) > 10 else "00:00"

          push_items = []
          for ev in filtered:
              date_jst, time_jst = parse_jst(ev.get("date",""))
              push_items.append({
                  "title":    ev.get("title",""),
                  "currency": ev.get("country",""),
                  "impact":   ev.get("impact",""),
                  "date":     date_jst,
                  "time":     time_jst,
                  "forecast": ev.get("forecast","") or "",
                  "previous": ev.get("previous","") or "",
                  "actual":   ev.get("actual","")   or "",
              })

          if push_items:
              VPS = "https://jpstocklive.com/api/push/ff_events"
              res = requests.post(VPS, json={"items": push_items}, timeout=15)
              print(f"VPS push: {res.status_code} | {res.text[:100]}")
          PYEOF
