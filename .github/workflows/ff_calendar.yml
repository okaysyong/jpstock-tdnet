name: ForexFactory Calendar Push

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push-events:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Events & Push to VPS
        run: |
          pip install -q beautifulsoup4
          python3 << 'PYEOF'
          import requests, json, re
          from datetime import datetime, timezone, timedelta, date
          from bs4 import BeautifulSoup

          JST = timezone(timedelta(hours=9))
          year = datetime.now(JST).year

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "ja,en-US;q=0.9",
          }

          # 통화 판단 키워드
          USD_KW = ["米","FRB","FOMC","ISM","NFP","MBA","ダウ","ナスダック","連邦","財務省","ADP",
                    "CPI","PPI","GDP","PCE","PMI","ISM","雇用統計","消費者信頼","住宅着工",
                    "小売売上","貿易収支","鉱工業生産指数（米）","Fed","Dollar"]
          JPY_KW = ["日銀","日本","国内","日経","円","BOJ","短観","景況","対外","対内","設備稼働",
                    "鉱工業生産[","生産者物価","消費者物価（日","RICS","BSI","機械受注"]

          def guess_currency(title, img_src=""):
              """제목/이미지로 통화 판단"""
              src = img_src.lower()
              if "us_" in src or "usa" in src or "america" in src or "dollar" in src:
                  return "USD"
              if "jp_" in src or "japan" in src or "yen" in src:
                  return "JPY"
              # 제목 키워드
              for kw in USD_KW:
                  if kw in title:
                      return "USD"
              for kw in JPY_KW:
                  if kw in title:
                      return "JPY"
              # 영어 제목 → 대부분 USD
              if re.search(r'[A-Z]{2,}', title):
                  return "USD"
              return "JPY"  # 기본값

          # ── nikkei225jp.com 스크래핑 ──
          nk_events = []
          try:
              r = requests.get("https://nikkei225jp.com/schedule/", headers=headers, timeout=15)
              print(f"nikkei225jp: {r.status_code}")
              if r.status_code == 200:
                  soup = BeautifulSoup(r.text, "html.parser")
                  main_table = None
                  for t in soup.find_all("table"):
                      if len(t.find_all("tr")) > 10:
                          main_table = t
                          break

                  if main_table:
                      current_date = None
                      for row in main_table.find_all("tr"):
                          cells = row.find_all(["td","th"])
                          texts = [c.get_text(strip=True) for c in cells]
                          if not texts:
                              continue

                          # 날짜 행
                          if len(texts) == 1 and re.match(r'\d+/\d+', texts[0]):
                              m = re.match(r'(\d+)/(\d+)', texts[0])
                              if m:
                                  current_date = f"{year}-{int(m.group(1)):02d}-{int(m.group(2)):02d}"
                              continue

                          # 데이터 행
                          if len(texts) >= 6 and re.match(r'\d+:\d+', texts[0]):
                              time_str = texts[0]
                              stars    = texts[1].count("★")
                              title    = texts[2]
                              actual   = texts[3]
                              forecast = texts[4]
                              previous = texts[5]

                              # 이미지 src로 통화 판단
                              img = cells[2].find("img") if len(cells) > 2 else None
                              img_src = img.get("src","") if img else ""
                              currency = guess_currency(title, img_src)

                              if current_date and stars >= 2:
                                  nk_events.append({
                                      "date": current_date, "time": time_str,
                                      "title": title, "actual": actual,
                                      "forecast": forecast, "previous": previous,
                                      "currency": currency, "stars": stars,
                                  })

                  print(f"파싱: {len(nk_events)}건")
                  # 통화 분포 확인
                  usd = sum(1 for e in nk_events if e["currency"]=="USD")
                  jpy = sum(1 for e in nk_events if e["currency"]=="JPY")
                  print(f"  USD:{usd} JPY:{jpy}")
                  for ev in nk_events[:5]:
                      print(f"  {ev['date']} {ev['time']} {ev['currency']} {ev['title'][:25]} | actual={ev['actual']}")

          except Exception as e:
              print(f"nikkei225jp error: {e}")
              import traceback; traceback.print_exc()

          # ── ForexFactory JSON (미래 일정 보완) ──
          ff_items = []
          for url in ["https://nfs.faireconomy.media/ff_calendar_thisweek.json",
                      "https://nfs.faireconomy.media/ff_calendar_nextweek.json"]:
              try:
                  res = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=15)
                  if res.status_code == 200:
                      ff_items.extend(res.json())
                      print(f"FF {url.split('/')[-1]}: {len(res.json())}건")
              except Exception as e:
                  print(f"FF error: {e}")

          def parse_jst(s):
              try:
                  dt = datetime.fromisoformat(s).astimezone(JST)
                  return dt.strftime("%Y-%m-%d"), dt.strftime("%H:%M")
              except:
                  return s[:10], "00:00"

          # nikkei225jp → push
          push_items = []
          for ev in nk_events:
              impact = "High" if ev["stars"] >= 4 else "Medium"
              push_items.append({
                  "title": ev["title"], "currency": ev["currency"],
                  "impact": impact, "date": ev["date"], "time": ev["time"],
                  "forecast": ev["forecast"], "previous": ev["previous"],
                  "actual": ev["actual"],
              })

          # FF 미래 일정 보완 (nikkei225jp에 없는 것)
          nk_keys = {(ev["date"], ev["time"][:5]) for ev in nk_events}
          for ev in ff_items:
              if ev.get("country") not in ("USD","JPY"): continue
              if ev.get("impact") not in ("High","Medium"): continue
              d, t = parse_jst(ev.get("date",""))
              if (d, t) not in nk_keys:
                  push_items.append({
                      "title": ev.get("title",""), "currency": ev.get("country",""),
                      "impact": ev.get("impact",""), "date": d, "time": t,
                      "forecast": ev.get("forecast","") or "",
                      "previous": ev.get("previous","") or "",
                      "actual": ev.get("actual","") or "",
                  })

          print(f"총 push: {len(push_items)}건 (actual: {sum(1 for p in push_items if p['actual'])}건)")

          if push_items:
              res = requests.post("https://jpstocklive.com/api/push/ff_events",
                                  json={"items": push_items}, timeout=30)
              print(f"VPS push: {res.status_code} | {res.text[:100]}")
          PYEOF
