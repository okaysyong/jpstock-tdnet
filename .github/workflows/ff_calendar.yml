name: ForexFactory Calendar Push

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push-events:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Events & Push to VPS
        run: |
          pip install -q beautifulsoup4
          python3 << 'PYEOF'
          import requests, json, re
          from datetime import datetime, timezone, timedelta, date
          from bs4 import BeautifulSoup

          JST = timezone(timedelta(hours=9))
          today_str = datetime.now(JST).strftime("%-m/%-d")  # "6/11" 형식
          year = datetime.now(JST).year

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "ja,en-US;q=0.9",
          }

          # ── 1. nikkei225jp.com 스크래핑 → actual 맵 ──
          nk_events = []  # [{date, time, title, actual, forecast, previous, currency, stars}]
          try:
              r = requests.get("https://nikkei225jp.com/schedule/", headers=headers, timeout=15)
              print(f"nikkei225jp: {r.status_code}")
              if r.status_code == 200:
                  soup = BeautifulSoup(r.text, "html.parser")
                  tables = soup.find_all("table")
                  
                  # 두 번째 테이블 (90행짜리)
                  main_table = None
                  for t in tables:
                      rows = t.find_all("tr")
                      if len(rows) > 10:
                          main_table = t
                          break
                  
                  if main_table:
                      current_date = None
                      current_year = year
                      rows = main_table.find_all("tr")
                      for row in rows:
                          cells = row.find_all(["td","th"])
                          texts = [c.get_text(strip=True) for c in cells]
                          if not texts:
                              continue
                          
                          # 날짜 행: "06/10(水)" 형식
                          if len(texts) == 1 and re.match(r'\d+/\d+', texts[0]):
                              m = re.match(r'(\d+)/(\d+)', texts[0])
                              if m:
                                  current_date = f"{current_year}-{int(m.group(1)):02d}-{int(m.group(2)):02d}"
                              continue
                          
                          # 데이터 행: 시간 | 중요도 | 지표명 | 결과 | 예상 | 전회
                          if len(texts) >= 6 and re.match(r'\d+:\d+', texts[0]):
                              time_str  = texts[0]  # "08:50"
                              stars_raw = texts[1]  # "★★★"
                              title     = texts[2]  # "05月 CPI..."
                              actual    = texts[3]  # "4.2%"
                              forecast  = texts[4]  # "4.1%"
                              previous  = texts[5]  # "3.8%"
                              
                              stars = stars_raw.count("★")
                              
                              # 통화 판단: 🇯🇵/🇺🇸 이미지 또는 텍스트에서
                              img = cells[2].find("img") if len(cells) > 2 else None
                              src = img.get("src","") if img else ""
                              if "us" in src.lower() or "america" in src.lower():
                                  currency = "USD"
                              elif "jp" in src.lower() or "japan" in src.lower():
                                  currency = "JPY"
                              else:
                                  # 제목으로 판단
                                  currency = "USD" if any(k in title for k in ["米","FRB","FOMC","ISM","NFP","MBA"]) else "JPY"
                              
                              if current_date and stars >= 2:
                                  nk_events.append({
                                      "date": current_date,
                                      "time": time_str,
                                      "title": title,
                                      "actual": actual,
                                      "forecast": forecast,
                                      "previous": previous,
                                      "currency": currency,
                                      "stars": stars,
                                  })
                      
                      print(f"nikkei225jp 파싱: {len(nk_events)}건 (★★ 이상)")
                      # 샘플 출력
                      for ev in nk_events[:5]:
                          print(f"  {ev['date']} {ev['time']} {ev['currency']} {ev['title'][:25]} | actual={ev['actual']} forecast={ev['forecast']}")
          except Exception as e:
              print(f"nikkei225jp error: {e}")
              import traceback; traceback.print_exc()

          # ── 2. ForexFactory JSON (일정/시간 보완) ──
          ff_items = []
          ff_headers = {"User-Agent": "Mozilla/5.0"}
          for url in ["https://nfs.faireconomy.media/ff_calendar_thisweek.json",
                      "https://nfs.faireconomy.media/ff_calendar_nextweek.json"]:
              try:
                  res = requests.get(url, headers=ff_headers, timeout=15)
                  if res.status_code == 200:
                      ff_items.extend(res.json())
                      print(f"FF OK {url.split('/')[-1]}: {len(res.json())}건")
              except Exception as e:
                  print(f"FF error: {e}")

          # ── 3. nikkei225jp + ForexFactory 머지 ──
          # nikkei225jp를 기준으로, FF에서 없는 미래 일정 보완
          push_items = []

          # nikkei225jp 데이터 → push
          for ev in nk_events:
              impact = "High" if ev["stars"] >= 4 else "Medium"
              push_items.append({
                  "title":    ev["title"],
                  "currency": ev["currency"],
                  "impact":   impact,
                  "date":     ev["date"],
                  "time":     ev["time"],
                  "forecast": ev["forecast"],
                  "previous": ev["previous"],
                  "actual":   ev["actual"],
              })

          # FF에서 nikkei225jp에 없는 미래 일정 추가
          def parse_jst(s):
              try:
                  dt = datetime.fromisoformat(s).astimezone(JST)
                  return dt.strftime("%Y-%m-%d"), dt.strftime("%H:%M")
              except:
                  return s[:10], "00:00"

          nk_keys = {(ev["date"], ev["time"][:5]) for ev in nk_events}
          for ev in ff_items:
              if ev.get("country") not in ("USD","JPY"): continue
              if ev.get("impact") not in ("High","Medium"): continue
              d, t = parse_jst(ev.get("date",""))
              if (d, t) not in nk_keys:
                  push_items.append({
                      "title":    ev.get("title",""),
                      "currency": ev.get("country",""),
                      "impact":   ev.get("impact",""),
                      "date":     d, "time": t,
                      "forecast": ev.get("forecast","") or "",
                      "previous": ev.get("previous","") or "",
                      "actual":   ev.get("actual","") or "",
                  })

          print(f"총 push: {len(push_items)}건")
          actual_cnt = sum(1 for p in push_items if p["actual"])
          print(f"actual 있는 항목: {actual_cnt}건")

          if push_items:
              res = requests.post("https://jpstocklive.com/api/push/ff_events",
                                  json={"items": push_items}, timeout=30)
              print(f"VPS push: {res.status_code} | {res.text[:100]}")
          PYEOF
