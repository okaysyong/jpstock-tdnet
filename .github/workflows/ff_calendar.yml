name: ForexFactory Calendar Push

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push-events:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ForexFactory & Push to VPS
        run: |
          python3 << 'PYEOF'
          import requests, json

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          items = []
          for url in [
              "https://nfs.faireconomy.media/ff_calendar_thisweek.json",
              "https://nfs.faireconomy.media/ff_calendar_nextweek.json",
          ]:
              try:
                  r = requests.get(url, headers=headers, timeout=15)
                  if r.status_code == 200:
                      data = r.json()
                      items.extend(data)
                      print(f"OK {url.split('/')[-1]}: {len(data)}건")
                  else:
                      print(f"NG {url.split('/')[-1]}: {r.status_code}")
              except Exception as e:
                  print(f"NG error: {e}")

          if not items:
              print("데이터 없음")
              exit(0)

          # 디버그: 필드 분포
          impacts = {}
          currencies = {}
          for ev in items:
              imp = ev.get("impact","(없음)")
              cur = ev.get("currency","(없음)")
              impacts[imp]    = impacts.get(imp, 0) + 1
              currencies[cur] = currencies.get(cur, 0) + 1
          print(f"impact 분포: {dict(sorted(impacts.items()))}")
          print(f"currency 분포: {dict(sorted(currencies.items()))}")
          print(f"샘플 1건: {json.dumps(items[0], ensure_ascii=False)}")

          # JPY/USD 전체 (impact 필터 없이 일단 push)
          filtered = [ev for ev in items if ev.get("currency","") in ("JPY","USD")]
          print(f"JPY/USD 전체: {len(filtered)}건")

          push_items = [{
              "title":    ev.get("title",""),
              "currency": ev.get("currency",""),
              "impact":   ev.get("impact",""),
              "date":     ev.get("date",""),
              "time":     ev.get("time",""),
              "forecast": ev.get("forecast","") or "",
              "previous": ev.get("previous","") or "",
              "actual":   ev.get("actual","")   or "",
          } for ev in filtered]

          VPS = "https://jpstocklive.com/api/push/ff_events"
          try:
              res = requests.post(VPS, json={"items": push_items}, timeout=15)
              print(f"VPS push: {res.status_code} | {res.text[:120]}")
          except Exception as e:
              print(f"VPS push 실패: {e}")
          PYEOF
