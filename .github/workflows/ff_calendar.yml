name: ForexFactory Calendar Push

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push-events:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Finnhub & Push to VPS
        run: |
          python3 << 'PYEOF'
          import requests, json
          from datetime import datetime, timezone, timedelta, date

          JST = timezone(timedelta(hours=9))
          TOKEN = "d8lcsp9r01qtamgu4cg0d8lcsp9r01qtamgu4cgg"

          # 오늘~7일 후
          today = date.today().isoformat()
          week  = (date.today() + timedelta(days=7)).isoformat()

          url = f"https://finnhub.io/api/v1/calendar/economic?from={today}&to={week}&token={TOKEN}"
          r = requests.get(url, timeout=15)
          print(f"Finnhub status: {r.status_code}")
          print(f"응답: {r.text[:200]}")

          if r.status_code != 200:
              exit(1)

          events = r.json().get("economicCalendar", [])
          print(f"총: {len(events)}건")
          for ev in events[:5]:
              print(f"  {ev.get('time','?')[:16]} {ev.get('country','?')} {ev.get('event','?')[:30]} | actual={ev.get('actual','')} forecast={ev.get('estimate','')}")
          PYEOF
