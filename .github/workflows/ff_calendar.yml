name: ForexFactory Calendar Push

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push-events:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ForexFactory & Push to VPS
        run: |
          python3 << 'PYEOF'
          import requests, json

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          items = []
          for url in [
              "https://nfs.faireconomy.media/ff_calendar_thisweek.json",
              "https://nfs.faireconomy.media/ff_calendar_nextweek.json",
          ]:
              try:
                  r = requests.get(url, headers=headers, timeout=15)
                  if r.status_code == 200:
                      data = r.json()
                      items.extend(data)
                      print(f"OK {url.split('/')[-1]}: {len(data)}건")
                  else:
                      print(f"NG {url.split('/')[-1]}: {r.status_code}")
              except Exception as e:
                  print(f"NG error: {e}")

          if not items:
              print("데이터 없음")
              exit(0)

          # country 필드 기반 필터 (currency 아님)
          countries = {}
          for ev in items:
              c = ev.get("country","(없음)")
              countries[c] = countries.get(c, 0) + 1
          print(f"country 분포: {dict(sorted(countries.items()))}")

          # USD/JPY country 코드 확인용 샘플
          for ev in items[:5]:
              print(f"  샘플: {json.dumps(ev, ensure_ascii=False)}")

          # USD + JPY + High/Medium 필터
          TARGET_COUNTRIES = {"USD", "JPY"}
          TARGET_IMPACTS   = {"High", "Medium"}
          filtered = [
              ev for ev in items
              if ev.get("country","") in TARGET_COUNTRIES
              and ev.get("impact","") in TARGET_IMPACTS
          ]
          print(f"필터 후: {len(filtered)}건 (USD/JPY, High/Medium)")

          if not filtered:
              print("push 없음 — 종료")
              exit(0)

          push_items = [{
              "title":    ev.get("title",""),
              "currency": ev.get("country",""),   # country → currency 매핑
              "impact":   ev.get("impact",""),
              "date":     ev.get("date","")[:10],  # ISO 날짜만
              "time":     ev.get("date","")[11:16] if len(ev.get("date","")) > 10 else "",
              "forecast": ev.get("forecast","") or "",
              "previous": ev.get("previous","") or "",
              "actual":   ev.get("actual","")   or "",
          } for ev in filtered]

          print(f"push_items 샘플: {push_items[0] if push_items else 'none'}")

          VPS = "https://jpstocklive.com/api/push/ff_events"
          try:
              res = requests.post(VPS, json={"items": push_items}, timeout=15)
              print(f"VPS push: {res.status_code} | {res.text[:120]}")
          except Exception as e:
              print(f"VPS push 실패: {e}")
          PYEOF
