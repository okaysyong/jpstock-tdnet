name: ForexFactory Calendar Push

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push-events:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Events & Push to VPS
        run: |
          pip install -q beautifulsoup4
          python3 << 'PYEOF'
          import requests, json, re
          from datetime import datetime, timezone, timedelta
          from bs4 import BeautifulSoup

          JST = timezone(timedelta(hours=9))
          year = datetime.now(JST).year
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "ja,en-US;q=0.9",
          }

          # ── 1. nikkei225jp → actual 맵 (제목+시간 기준) ──
          actual_map = {}  # (time, title_normalized) → actual
          try:
              r = requests.get("https://nikkei225jp.com/schedule/", headers=headers, timeout=15)
              if r.status_code == 200:
                  soup = BeautifulSoup(r.text, "html.parser")
                  main_table = next((t for t in soup.find_all("table") if len(t.find_all("tr")) > 10), None)
                  if main_table:
                      current_date = None
                      for row in main_table.find_all("tr"):
                          cells = row.find_all(["td","th"])
                          texts = [c.get_text(strip=True) for c in cells]
                          if not texts: continue
                          if len(texts) == 1 and re.match(r'\d+/\d+', texts[0]):
                              m = re.match(r'(\d+)/(\d+)', texts[0])
                              if m:
                                  current_date = f"{year}-{int(m.group(1)):02d}-{int(m.group(2)):02d}"
                              continue
                          if len(texts) >= 6 and re.match(r'\d+:\d+', texts[0]) and current_date:
                              time_str = texts[0]
                              title    = texts[2]
                              actual   = texts[3]
                              if actual:
                                  actual_map[(current_date, time_str, title)] = actual
                  print(f"nikkei225jp actual 맵: {len(actual_map)}건")
          except Exception as e:
              print(f"nikkei225jp error: {e}")

          # ── 2. ForexFactory JSON (USD/JPY 기준, country 명확) ──
          ff_items = []
          for url in ["https://nfs.faireconomy.media/ff_calendar_thisweek.json",
                      "https://nfs.faireconomy.media/ff_calendar_nextweek.json"]:
              try:
                  res = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=15)
                  if res.status_code == 200:
                      ff_items.extend(res.json())
                      print(f"FF {url.split('/')[-1]}: {len(res.json())}건")
              except Exception as e:
                  print(f"FF error: {e}")

          # ── 3. USD/JPY High/Medium 필터 ──
          TARGET = {"USD", "JPY"}
          IMPACT = {"High", "Medium"}
          filtered = [ev for ev in ff_items
                      if ev.get("country","") in TARGET
                      and ev.get("impact","") in IMPACT]
          print(f"FF 필터: {len(filtered)}건 (USD/JPY, High/Medium)")

          def parse_jst(s):
              try:
                  dt = datetime.fromisoformat(s).astimezone(JST)
                  return dt.strftime("%Y-%m-%d"), dt.strftime("%H:%M")
              except:
                  return s[:10], "00:00"

          # ── 4. FF 기준으로 push, nikkei225jp에서 actual 보완 ──
          # FF 제목 → nikkei225jp 제목 매핑 (주요 지표)
          TITLE_MAP = {
              "Core CPI m/m":           "消費者物価指数（CPIコア指数）[前月比]",
              "Core CPI y/y":           "消費者物価指数（CPIコア指数）[前年比]",
              "CPI m/m":                "消費者物価指数（CPI）[前月比]",
              "CPI y/y":                "消費者物価指数（CPI）[前年比]",
              "Core PPI m/m":           "生産者物価指数（PPIコア指数）[前月比]",
              "PPI m/m":                "生産者物価指数（PPI）[前月比]",
              "Core PPI y/y":           "生産者物価指数（PPIコア指数）[前年比]",
              "PPI y/y":                "生産者物価指数（PPI）[前年比]",
              "Unemployment Claims":    "新規失業保険申請件数",
              "Prelim UoM Consumer Sentiment": "ミシガン大学消費者信頼感指数",
          }

          push_items = []
          for ev in filtered:
              d, t = parse_jst(ev.get("date",""))
              ff_title = ev.get("title","")

              # nikkei225jp에서 actual 찾기
              actual = ev.get("actual","") or ""
              if not actual:
                  # 직접 제목 매칭
                  nk_title = TITLE_MAP.get(ff_title, "")
                  if nk_title:
                      # 월 prefix 무시하고 검색
                      for (nd, nt, ntitle), nact in actual_map.items():
                          if nd == d and nt == t and nk_title in ntitle:
                              actual = nact
                              break
                  # 매핑 없으면 부분 매칭
                  if not actual:
                      for (nd, nt, ntitle), nact in actual_map.items():
                          if nd == d and nt == t and ff_title[:8].lower() in ntitle.lower():
                              actual = nact
                              break

              push_items.append({
                  "title":    ff_title,
                  "currency": ev.get("country",""),
                  "impact":   ev.get("impact",""),
                  "date":     d, "time": t,
                  "forecast": ev.get("forecast","") or "",
                  "previous": ev.get("previous","") or "",
                  "actual":   actual,
              })

          actual_cnt = sum(1 for p in push_items if p["actual"])
          print(f"총 push: {len(push_items)}건 (actual: {actual_cnt}건)")
          for p in push_items[:4]:
              print(f"  {p['date']} {p['time']} {p['currency']} {p['title'][:28]} | actual={p['actual']}")

          if push_items:
              res = requests.post("https://jpstocklive.com/api/push/ff_events",
                                  json={"items": push_items}, timeout=30)
              print(f"VPS push: {res.status_code} | {res.text[:100]}")
          PYEOF
