name: Economic calendar
on:
  schedule:
    - cron: '4-59/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: economic-calendar
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.lock.txt
      - run: python collect_calendar.py
        env:
          VPS_NEWS_API_URL: https://jpstocklive.com
          VPS_PUSH_TOKEN: ${{ secrets.VPS_PUSH_TOKEN || secrets.VPS_PUSH_SECRET || secrets.VPS_TOKEN }}
