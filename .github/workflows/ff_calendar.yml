name: ForexFactory Calendar Push

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push-events:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Events & Push to VPS
        run: |
          pip install -q beautifulsoup4
          python3 << 'PYEOF'
          import requests, json, re
          from datetime import datetime, timezone, timedelta
          from bs4 import BeautifulSoup

          JST = timezone(timedelta(hours=9))
          year = datetime.now(JST).year
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "ja,en-US;q=0.9",
          }

          JPY_KW = [
              "国内企業物価","日銀","BOJ","景況判断BSI","短観",
              "対外証券投資","対内証券投資","機械受注","月次GDP",
              "鉱工業生産指数","設備稼働率","完全失業率","有効求人",
              "家計調査","RICS住宅価格","国内","景気動向",
          ]
          USD_KW = [
              "MBA住宅ローン","原油在庫","ガソリン在庫","留出油在庫",
              "FRB","FOMC","連邦","ADP雇用","非農業部門","ミシガン大学",
              "EIA","Baker Hughes","米.*CPI","米.*PPI","米.*GDP",
          ]
          ENG_USD = [
              "Bill Auction","Bond Auction","PMI","ISM","NFP",
              "Retail Sales","Housing","Unemployment","Jobless","Fed",
              "Capacity Utilization","Industrial Production",
              "Consumer Confidence","Producer Price","Consumer Price",
              "Nonfarm","Initial Claims","Continuing Claims",
              "UoM","Michigan","Prelim","Flash",
          ]

          def guess_currency(title, time_str):
              for kw in JPY_KW:
                  if re.search(kw, title): return "JPY"
              for kw in USD_KW:
                  if re.search(kw, title): return "USD"
              for kw in ENG_USD:
                  if kw in title: return "USD"
              if re.match(r'^[A-Za-z0-9\s\-\./\(\)]+$', title.strip()):
                  return "USD"
              try:
                  h = int(time_str.split(":")[0])
                  if 8 <= h <= 14: return "JPY"
                  if 20 <= h <= 23: return "USD"
              except: pass
              if re.search(r'[\u3040-\u9fff]', title): return "JPY"
              return "USD"

          # nikkei225jp 스크래핑
          nk_events = []
          try:
              r = requests.get("https://nikkei225jp.com/schedule/", headers=headers, timeout=15)
              print(f"nikkei225jp: {r.status_code}")
              if r.status_code == 200:
                  soup = BeautifulSoup(r.text, "html.parser")
                  main_table = next((t for t in soup.find_all("table") if len(t.find_all("tr")) > 10), None)
                  if main_table:
                      current_date = None
                      for row in main_table.find_all("tr"):
                          cells = row.find_all(["td","th"])
                          texts = [c.get_text(strip=True) for c in cells]
                          if not texts: continue
                          if len(texts) == 1 and re.match(r'\d+/\d+', texts[0]):
                              m = re.match(r'(\d+)/(\d+)', texts[0])
                              if m:
                                  current_date = f"{year}-{int(m.group(1)):02d}-{int(m.group(2)):02d}"
                              continue
                          if len(texts) >= 6 and re.match(r'\d+:\d+', texts[0]) and current_date:
                              stars = texts[1].count("★")
                              if stars < 2: continue
                              nk_events.append({
                                  "date": current_date, "time": texts[0],
                                  "title": texts[2], "actual": texts[3],
                                  "forecast": texts[4], "previous": texts[5],
                                  "currency": guess_currency(texts[2], texts[0]),
                                  "stars": stars,
                              })
                  usd = sum(1 for e in nk_events if e["currency"]=="USD")
                  jpy = sum(1 for e in nk_events if e["currency"]=="JPY")
                  print(f"파싱: {len(nk_events)}건 (USD:{usd} JPY:{jpy})")
                  for ev in nk_events[:4]:
                      print(f"  {ev['date']} {ev['time']} {ev['currency']} {ev['title'][:28]} | actual={ev['actual']}")
          except Exception as e:
              print(f"error: {e}")
              import traceback; traceback.print_exc()

          # ForexFactory JSON
          ff_items = []
          for url in ["https://nfs.faireconomy.media/ff_calendar_thisweek.json",
                      "https://nfs.faireconomy.media/ff_calendar_nextweek.json"]:
              try:
                  res = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=15)
                  if res.status_code == 200:
                      ff_items.extend(res.json())
              except: pass
          print(f"FF: {len(ff_items)}건")

          def parse_jst(s):
              try:
                  dt = datetime.fromisoformat(s).astimezone(JST)
                  return dt.strftime("%Y-%m-%d"), dt.strftime("%H:%M")
              except:
                  return s[:10], "00:00"

          push_items = []
          for ev in nk_events:
              push_items.append({
                  "title": ev["title"], "currency": ev["currency"],
                  "impact": "High" if ev["stars"] >= 4 else "Medium",
                  "date": ev["date"], "time": ev["time"],
                  "forecast": ev["forecast"], "previous": ev["previous"],
                  "actual": ev["actual"],
              })

          nk_keys = {(ev["date"], ev["time"][:5]) for ev in nk_events}
          for ev in ff_items:
              if ev.get("country") not in ("USD","JPY"): continue
              if ev.get("impact") not in ("High","Medium"): continue
              d, t = parse_jst(ev.get("date",""))
              if (d, t) not in nk_keys:
                  push_items.append({
                      "title": ev.get("title",""), "currency": ev.get("country",""),
                      "impact": ev.get("impact",""), "date": d, "time": t,
                      "forecast": ev.get("forecast","") or "",
                      "previous": ev.get("previous","") or "",
                      "actual": ev.get("actual","") or "",
                  })

          print(f"총 push: {len(push_items)}건 (actual: {sum(1 for p in push_items if p['actual'])}건)")
          if push_items:
              res = requests.post("https://jpstocklive.com/api/push/ff_events",
                                  json={"items": push_items}, timeout=30)
              print(f"VPS push: {res.status_code} | {res.text[:100]}")
          PYEOF
