name: fetch-kessan

on:
  schedule:
    # 매일 06:00 JST (= 21:00 UTC 전날)
    - cron: '0 21 * * 0-4'   # 일~목 (월~금 JST)
  workflow_dispatch:           # 수동 실행

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch kessan schedule
        env:
          JQUANTS_API_KEY:  ${{ secrets.JQUANTS_API_KEY }}
          VPS_BASE_URL:     ${{ secrets.VPS_URL }}
          VPS_PUSH_SECRET:  ${{ secrets.VPS_PUSH_SECRET }}
        run: python fetch_kessan.py
