name: fetch-kessan

on:
  schedule:
    - cron: '0 21 * * 0-4'   # 매일 06:00 JST (일~목)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch kessan schedule
        env:
          VPS_BASE_URL:    ${{ secrets.VPS_URL }}
          VPS_PUSH_SECRET: ${{ secrets.VPS_PUSH_SECRET }}
        run: python fetch_kessan.py
