name: Debug NK

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug
        run: |
          pip install -q beautifulsoup4
          python3 << 'PYEOF'
          import requests, re
          from bs4 import BeautifulSoup

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          r = requests.get("https://nikkei225jp.com/schedule/", headers=headers, timeout=15)
          soup = BeautifulSoup(r.text, "html.parser")

          main_table = None
          for t in soup.find_all("table"):
              if len(t.find_all("tr")) > 10:
                  main_table = t
                  break

          count = 0
          for row in main_table.find_all("tr"):
              cells = row.find_all(["td","th"])
              texts = [c.get_text(strip=True) for c in cells]
              if len(texts) >= 6 and re.match(r'\d+:\d+', texts[0]):
                  img = cells[2].find("img") if len(cells) > 2 else None
                  img_src = img.get("src","") if img else "(없음)"
                  print(f"{texts[0]} | {texts[2][:25]} | img={img_src}")
                  count += 1
                  if count >= 15:
                      break
          PYEOF
