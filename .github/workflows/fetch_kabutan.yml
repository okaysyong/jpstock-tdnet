name: Collect Kabutan News

on:
  schedule:
    - cron: '*/5 0-7 * * 1-5'   # 평일 09:00~16:00 JST (UTC 00:00~07:00)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        env:
          VPS_NEWS_API_URL: ${{ secrets.VPS_URL }}
          VPS_TOKEN: ${{ secrets.VPS_TOKEN }}
        run: python collect_kabutan.py
